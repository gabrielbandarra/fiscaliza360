    H('ABERTURA (0:00–0:30)'); P(`“${p.manchete}. Neste vídeo eu mostro, com documentos oficiais, o que os números revelam e o que ainda precisa ser explicado.”`);
    H('BLOCO 1 – O QUE ACONTECEU (0:30–1:30)'); P(p.lead);
    H('BLOCO 2 – OS NÚMEROS (1:30–2:45)'); LI(N.map(([k,v])=>`${k}: ${v}`)); for (const t of [p.tabela,p.tabela2]) if (t&&t.rows&&t.rows.length){ P(`Mostrar na tela: ${t.titulo}`); LI(linhaTab(t,6)); }
    H('BLOCO 3 – POR QUE IMPORTA E O QUE DIZ A LEI (2:45–3:45)'); LI([...(p.porque||[]), ...(p.lei||[]).map(leiCurta)]);
    H('BLOCO 4 – O OUTRO LADO (3:45–4:30)'); P('“Procuramos [ÓRGÃO/PESSOA] com as seguintes perguntas:”'); LI(p.perguntas||[]); P('“Até a publicação deste vídeo, [não houve resposta / a resposta foi: ...].”');
    H('BLOCO 5 – PRÓXIMOS PASSOS (4:30–5:15)'); P('“Vamos pedir os documentos pela Lei de Acesso à Informação e encaminhar o caso aos órgãos de controle, se for o caso. Acompanhe.”');
    H('ENCERRAMENTO (5:15–5:45)'); P('“Se você quer saber para onde vai o seu dinheiro, se inscreva e compartilhe. Todos os documentos estão na descrição.”');
    H('DESCRIÇÃO DO VÍDEO'); P(`${p.manchete}. ${p.linha_fina||''}`); P('Fontes:'); LI(fontesTxt(p)); P(hashtags(p));
    H('IMAGENS DE APOIO'); LI(p.imagens||[]);
  }
  else if (tipo==='materia') {
    T(p.manchete); B.push({assunto:p.linha_fina||''});

    if (N.length) { H('Os números'); LI(N.map(([k,v])=>`${k}: ${v}`)); }
    if ((p.porque||[]).length) { H('Por que importa'); (p.porque||[]).forEach(P); }
    if ((p.lei||[]).length) { H('O que diz a lei'); LI(p.lei.map(leiCurta)); }
    for (const t of [p.tabela,p.tabela2]) if (t&&t.rows&&t.rows.length) B.push({tabela:{titulo:t.titulo, cols:t.cols.filter(c=>!['ctr','lic','conv','em','pvl','prop','url'].includes(c[2])).slice(0,6), rows:t.rows.slice(0,15), total:t.rows.length}});
    H('Outro lado'); P(`Procurado(s), ${(p.procurar||['o órgão responsável']).slice(0,2).join(' e ')} [não se manifestou até a publicação / informou que ...]. O espaço segue aberto.`);
    H('Como apuramos'); P(`Os dados foram extraídos em ${hoje_} de bases públicas e oficiais, listadas abaixo. Valores de empenho correspondem a despesas reservadas no orçamento, que podem não ter sido integralmente pagas.`); LI(fontesTxt(p));
  }
  else if (tipo==='nota') {

  }
  else if (tipo==='post') {
    T('POST PARA REDES'); P(`📌 ${p.manchete}`); LI(N.slice(0,4).map(([k,v])=>`${k}: ${v}`)); if((p.porque||[])[0]) P(p.porque[0]);

    H('Números'); LI(N.map(([k,v])=>`${k}: ${v}`)); H('Por que importa'); LI(p.porque||[]); H('O que diz a lei'); LI(p.lei||[]);
    H('Perguntas'); LI(p.perguntas||[]); H('Quem procurar'); LI(p.procurar||[]); H('Fontes'); LI(fontesTxt(p));
    for (const t of [p.tabela,p.tabela2]) if (t&&t.rows&&t.rows.length) B.push({tabela:{titulo:t.titulo, cols:t.cols.filter(c=>!['ctr','lic','conv','em','pvl','prop','url'].includes(c[2])).slice(0,7), rows:t.rows.slice(0,60), total:t.rows.length}});
    for (const x of (p.extras||[])) { H(x.titulo); LI(x.itens); }
    if (p.abrir) P(`Dossiê completo no programa: ${p.abrir.rotulo}. Use “Baixar documentos (ZIP)” para anexar os PDFs oficiais.`);
  }
  B.push({rodape:`Gerado em ${hoje_} a partir de dados públicos oficiais. Confira os dados e ouça os citados antes de publicar.`});
  return B;
}
const NOMES_CONTEUDO = {curto:'Roteiro video curto', longo:'Roteiro video longo', materia:'Materia', nota:'Pedido de posicionamento', dossie:'Dossie da pauta', post:'Post redes'};
// ---- conteúdo escrito pela IA a partir de TODOS os fatos do caso (sem IA configurada, usa o molde acima)
function contextoConteudo(p){
  const L=[`ASSUNTO: ${p.manchete}`];
  if (p.linha_fina) L.push(`RESUMO: ${p.linha_fina}`);
  if (p.lead) L.push(`FATO PRINCIPAL: ${p.lead}`);
  if (p.gravidade) L.push(`GRAVIDADE DO INDÍCIO: ${(GRAV[p.gravidade]||GRAV.info)[0]}${p.motivo_gravidade?' – '+p.motivo_gravidade:''}`);
  if ((p.numeros||[]).length) L.push('NÚMEROS OFICIAIS:\n'+p.numeros.filter(([k])=>!/índice de risco/i.test(k)).map(([k,v])=>`- ${k}: ${v}`).join('\n'));
  if ((p.porque||[]).length) L.push('POR QUE IMPORTA / OUTROS FATOS:\n'+p.porque.map(x=>'- '+x).join('\n'));
  if ((p.lei||[]).length) L.push('LEI APLICÁVEL:\n'+p.lei.map(x=>'- '+x).join('\n'));
  if ((p.perguntas||[]).length) L.push('PERGUNTAS QUE PRECISAM DE RESPOSTA:\n'+p.perguntas.map(x=>'- '+x).join('\n'));
  if ((p.procurar||[]).length) L.push('QUEM DEVE SER PROCURADO:\n'+p.procurar.map(x=>'- '+x).join('\n'));
  for (const x of (p.extras||[])) if ((x.itens||[]).length) L.push(`${x.titulo.toUpperCase()}:\n`+x.itens.map(i=>'- '+i).join('\n'));
  for (const t of [p.tabela,p.tabela2]) if (t&&t.rows&&t.rows.length) L.push(`${t.titulo} (${t.rows.length} linha(s)${t.rows.length>40?', mostrando 40':''}):\n`+t.rows.slice(0,40).map(r=>t.cols.filter(c=>!['ctr','lic','conv','em','pvl','prop','url'].includes(c[2])).map(c=>`${c[1]}: ${fmtPDF(r[c[0]],c[2])}`).join(' | ')).join('\n'));
  if (p._ctx) L.push('DETALHES E PROVAS DO ALERTA:\n'+p._ctx);
  if ((p.fontes||[]).length) L.push('FONTES OFICIAIS:\n'+p.fontes.map(f=>`- ${f.t}: ${f.u}`).join('\n'));
  return L.join('\n\n').slice(0,90000);
}

function textoParaBlocos(t){
  const B=[]; let li=null;
  const limpa = x => x.replace(/\*\*(.+?)\*\*/g,'$1').replace(/__(.+?)__/g,'$1').replace(/^\*(.+)\*$/,'$1');
  for (const bruta of String(t).split('\n')) {
    const l = bruta.trim();
    if (/^[-*•]\s+/.test(l)) { (li ||= []).push(limpa(l.replace(/^[-*•]\s+/,''))); continue; }
    if (li) { B.push({li}); li=null; }
    if (!l || /^-{3,}$/.test(l)) continue;
    if (/^#\s+/.test(l)) B.push({titulo:limpa(l.replace(/^#\s+/,''))});
    else if (/^#{2,}\s+/.test(l)) B.push({h:limpa(l.replace(/^#{2,}\s+/,''))});
    else B.push({p:limpa(l)});
  }
  if (li) B.push({li});
  B.push({rodape:`Gerado em ${new Date().toLocaleDateString('pt-BR')} a partir de dados públicos oficiais. Confira os dados e ouça os citados antes de publicar.`});
  return B;
}

  bt('#jcfec').addEventListener('click',()=>J.remove());
  J.addEventListener('click',e=>{ if(e.target===J) J.remove(); });
  const pronto = (t) => { CONTEUDO_IA[chave]=t; ['#jcpdf','#jccop','#jcref'].forEach(i=>bt(i).disabled=false); };

  const escrever = async () => {

    let txt = '', ult = 0, ok = false;
    caixa.innerHTML = '<p class="carregando">A IA está lendo os fatos do caso e escrevendo… (leva de 30 segundos a 2 minutos)</p>';
    for (let tent=0; tent<4 && !ok; tent++) {
      if (tent) { caixa.innerHTML = `<p class="carregando">A conexão caiu; tentando de novo (${tent}ª vez)…</p>`; await new Promise(r=>setTimeout(r,[0,4000,8000,15000][tent])); }

        if (!r.ok) throw new Error('HTTP '+r.status);
        const rd=r.body.getReader(), dec=new TextDecoder(); txt='';

    $('ld').innerHTML = R.docs.length ? `<p class="note">${R.docs.length.toLocaleString('pt-BR')} documento${R.docs.length>1?'s':''}${st.q||st.tipo?' encontrados':' guardados'}, do mais recente para o mais antigo.</p><div class="pautas">${R.docs.map(linhaDoc).join('')}</div>`
      : `<p class="empty">${st.q||st.tipo?'Nenhum documento encontrado.':'Nenhum documento enviado ainda.'}</p>`; };
  const enviar = async files => {

        const R = await r.json();
        if (R.erro) { li.innerHTML=`<b>${esc(f.name)}</b> <span class="note" style="color:var(--alta)">não foi guardado: ${esc(R.erro)}</span>`; continue; }
        const d = R.doc;
        li.innerHTML = `<b>${esc(f.name)}</b> ${R.duplicado?'<span class="note">já estava guardado.</span>':'<span class="note">guardado. Identificado como:</span>'}
          <span class="pill g-info">${esc(d.tipo)}</span> ${d.data_doc?esc(br(d.data_doc)):''} ${d.orgao?'· '+esc(d.orgao):''} ${chips((d.municipios||[]).slice(0,4))}
          ${R.sem_texto?'<span class="note" style="display:block">Não consegui ler o texto deste arquivo (foto ou documento escaneado). Abra-o e preencha os campos ou cole o texto.</span>':''}
          <button class="mini" data-abrir="meudoc" data-ref="${d.id}">Abrir e conferir</button>`;
      } catch(e) { li.innerHTML=`<b>${esc(f.name)}</b> <span class="note" style="color:var(--alta)">erro ao enviar (${esc(e.message)})</span>`; }
    }
    draw();

  $('arq').addEventListener('change',e=>{ enviar([...e.target.files]); e.target.value=''; });
  const dz=$('drop');
  ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{ e.preventDefault(); dz.classList.add('sobre'); }));
  ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{ e.preventDefault(); dz.classList.remove('sobre'); }));
  dz.addEventListener('drop',e=>{ if(e.dataTransfer.files.length) enviar([...e.dataTransfer.files]); });
  $('qd').addEventListener('input',e=>{ st.q=e.target.value; clearTimeout(tm); tm=setTimeout(draw,350); });
  $('td').addEventListener('change',e=>{ st.tipo=e.target.value; draw(); });
  draw();
}

const DS_KEY = 'fiscaliza360-municipio-ds';
// faixa fixa no topo do município: prefeito(a) em exercício e partido atual (TSE + troca de partido noticiada depois da eleição)
const PREF_CACHE = {};
async function faixaPrefeito(box){
  if (!box) return;
  const mun = box.dataset.mun, dt = s => s ? s.slice(0,10).split('-').reverse().join('/') : '';
  const tc = n => String(n||'').toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase());
  let r = PREF_CACHE[mun];
  try { if (!r) { r = await fetch('/api/prefeito?municipio=' + encodeURIComponent(mun)).then(x=>x.json()); if (!r.erro) PREF_CACHE[mun] = r; } }
  catch(e) { r = {erro: 'não foi possível consultar agora'}; }
  if (!box.isConnected || box.dataset.mun !== mun) return;
  if (r.erro) { box.innerHTML = `<span class="pref-rot">Prefeito(a) atual</span> <span class="note">${esc(r.erro)}</span>`; return; }
  let info;
  if (r.mudou) {
    const t = (r.noticias_troca || [])[0];
    info = `trocou de partido: era ${esc(r.partido_eleicao)} (eleito em ${r.ano_eleicao})` +
      (t ? ` · <a href="${esc(t.link)}" target="_blank" rel="noopener">notícia de ${dt(t.data)} (${esc(t.fonte)})</a>` : ` · ${esc(r.fonte_partido)}`);
  } else info = `partido pelo qual foi eleito em ${r.ano_eleicao}; nenhuma troca noticiada até ${dt(r.verificado)}`;
  const ng = (r.noticias_negociacao || [])[0];
  if (ng) info += ` · <b style="color:var(--alta);font-weight:600">troca em negociação (não confirmada):</b> <a href="${esc(ng.link)}" target="_blank" rel="noopener">“${esc(ng.titulo)}” (${esc(ng.fonte)}, ${dt(ng.data)})</a>`;
  if (r.vice) info += ` · Vice: ${esc(tc(r.vice.nome))} (${esc(r.vice.partido)}, na eleição)`;
  box.title = `${r.nome} · nome de urna: ${r.urna} · partido atual: ${r.partido_atual} (fonte: ${r.fonte_partido}) · eleito em ${r.ano_eleicao} pelo ${r.partido_eleicao} (TSE)`;

}

// ------------------------------------------------------------ Verificar proposição (antes de protocolar)
const VKEY = 'fiscaliza360-verificador';
function renderVerificar(){
  let cfg = {}; try { cfg = JSON.parse(localStorage.getItem(VKEY)||'{}'); } catch(_) {}
  const TIPOS_V = ['Projeto de Lei','Projeto de Lei Complementar','Projeto de Resolução','Projeto de Decreto Legislativo','Proposta de Emenda (Lei Orgânica ou Constituição)','Requerimento','Indicação','Moção'];
  $('main').innerHTML = `<p class="note">Antes de protocolar, confira se já existe proposição ou lei parecida e se há impedimento: matéria que já virou lei, projeto rejeitado nesta sessão legislativa, proposição semelhante em tramitação, vício de iniciativa (assuntos que só o prefeito ou o governador podem propor) ou de competência (assuntos da União). É uma triagem para ajudar a decisão; a palavra final é da procuradoria ou da assessoria legislativa da Casa.</p>
    <div class="form">
      <label>Tipo<select id="vt">${TIPOS_V.map(t=>`<option ${t===(cfg.tipo||'Projeto de Lei')?'selected':''}>${t}</option>`).join('')}</select></label>
      <label>Seu nome como autor (opcional)<input id="va" value="${esc(cfg.autor||'')}" placeholder="Para marcar as proposições que são suas"></label>
      <label style="grid-column:1/-1">Ementa ou texto da proposição<textarea id="vx" rows="5" style="font:inherit;font-size:.95rem;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)" placeholder="Ex.: Institui o programa municipal de hortas comunitárias nas escolas da rede pública">${esc(cfg.texto||'')}</textarea></label>
      <label class="chk"><input type="checkbox" id="vl" ${cfg.lauro!==false?'checked':''}> Câmara Municipal de Lauro de Freitas (proposições desde 2020 e leis publicadas)</label>
      <label class="chk"><input type="checkbox" id="vb" ${cfg.alba!==false?'checked':''}> Assembleia Legislativa da Bahia (todas as proposições desde 2019)</label>
      <label class="chk"><input type="checkbox" id="vf" ${cfg.federal!==false?'checked':''}> Câmara dos Deputados (referência: projetos federais parecidos)</label>
    </div>
    <div class="bar" style="margin-top:10px"><button class="more prim" id="vgo">Verificar</button><button class="more" id="vpdf" hidden>Baixar relatório (PDF)</button></div>
    <div id="vres"></div>`;
  let R = null;
  const fold = s => String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  const COR = {alta:'alta', media:'media', baixa:'info'};
  const CAT = {lei:['virou lei','alta'], rejeitada:['rejeitada','alta'], tramitacao:['em tramitação','media'], aprovada:['aprovada','ok'], retirada:['retirada','info'], arquivada:['arquivada','info'], sem_desfecho:['sem desfecho','info'], referencia:['federal','info']};
  const ir_ = async () => {
    const c = {tipo:$('vt').value, autor:$('va').value.trim(), texto:$('vx').value.trim(), lauro:$('vl').checked, alba:$('vb').checked, federal:$('vf').checked};
    try { localStorage.setItem(VKEY, JSON.stringify(c)); } catch(_) {}
    if (c.texto.length < 10) { $('vres').innerHTML = '<p class="empty">Escreva a ementa ou o texto (pelo menos uma frase).</p>'; return; }
    const casas = [c.lauro?'lauro':'', c.alba?'alba':''].filter(Boolean).join(',');
    if (!casas) { $('vres').innerHTML = '<p class="empty">Marque pelo menos uma Casa.</p>'; return; }
    $('vres').innerHTML = '<p class="carregando">Comparando com as proposições e leis…</p>';
    R = await api('/api/verificar', {texto:c.texto, tipo:c.tipo, casas, autor:c.autor, federal:c.federal?'1':'0'});
    if (R.erro) { $('vres').innerHTML = `<p class="empty">${esc(R.erro)}</p>`; return; }
    $('vpdf').hidden = false;
    const alta = R.casas.some(k=>k.pontos.some(p=>p.gravidade==='alta'));
    $('vres').innerHTML = `<div class="alert ${alta?'alta':'media'}" style="cursor:default;margin-top:14px"><span class="pill">${alta?'atenção':'conferir'}</span><p><b>${esc(R.resumo)}</b></p></div>
      ${R.avisos.length?`<p class="note">${R.avisos.map(esc).join(' · ')}</p>`:''}
      ${R.casas.map(k=>`<div class="grp vcasa"><h3>${esc(k.nome)} <span class="note">· ${k.base.toLocaleString('pt-BR')} registros comparados · clique numa proposição para ver a tramitação e os documentos</span></h3>
        <p><b>${esc(k.conclusao)}</b></p>
        ${k.pontos.map(p=>`<div class="lin" style="cursor:default"><span class="etq ${COR[p.gravidade]}">${esc(p.tema)}</span><span>${esc(p.texto)}</span><span></span></div>`).join('')}
        ${k.parecidas.length?`<div class="tbl" style="margin-top:10px"><table><thead><tr><th>Semelhança</th><th>Proposição</th><th>Autor</th><th>Ementa</th><th>Situação</th></tr></thead><tbody>${k.parecidas.map(d=>{ const [cn,cc]=CAT[d.categoria]||[d.categoria,'info']; const sua = c.autor && fold(d.autor||'').includes(fold(c.autor));
          return `<tr><td class="n">${Math.round(d.semelhanca*100)}%</td><td style="white-space:nowrap">${esc(d.tipo||'')} ${esc(d.numero||'')}${d.ano?'/'+esc(d.ano):''}${d.url?` · <a href="${esc(d.url)}" target="_blank" rel="noopener">abrir</a>`:''}</td><td>${esc(d.autor||'')}${sua?' <span class="etq ok">sua</span>':''}</td><td class="w">${esc(d.ementa)}</td><td><span class="etq ${cc}">${esc(cn)}</span><br><span class="note">${esc(d.lei||d.situacao||'')}</span></td></tr>`; }).join('')}</tbody></table></div>`:'<p class="note">Nenhuma proposição parecida.</p>'}</div>`).join('')}
      ${(R.federal||[]).length?`<div class="grp"><h3><span class="esf u">União</span> Câmara dos Deputados · projetos parecidos (referência)</h3><ul class="docs">${R.federal.map(d=>`<li><a href="${esc(d.url)}" target="_blank" rel="noopener">PL ${esc(d.numero)}/${esc(d.ano)}</a> · ${esc(d.ementa)}</li>`).join('')}</ul><p class="note">Se já existe lei federal sobre o assunto, a lei local só pode suplementá-la no que for de interesse local ou regional.</p></div>`:''}`;
  };
  const ligarLinhas = () => $('vres').querySelectorAll('.vcasa').forEach((g,ki)=>g.querySelectorAll('tbody tr').forEach((tr,i)=>{
    const d = R.casas[ki].parecidas[i]; if (!d) return; tr.classList.add('click'); tr.title = 'Clique para ver a tramitação e os documentos';
    tr.addEventListener('click', e=>{ if (e.target.closest('a')) return; abrirParecida(tr, d); }); }));
  const _ir = ir_;
  const irComLinhas = async () => { await _ir(); if (R && !R.erro) ligarLinhas(); };
  $('vgo').addEventListener('click', irComLinhas);
  $('vpdf').addEventListener('click', async () => { if (!R) return; const doc = novoPDF('Verificação de proposição', `${R.tipo} · gerado em ${hoje()}`);
    pdfTexto(doc,'Proposição analisada',11,true); pdfTexto(doc,R.texto); pdfTexto(doc,'Resultado',11,true); pdfTexto(doc,R.resumo);
    for (const k of R.casas) { pdfTexto(doc,k.nome,11,true); pdfTexto(doc,k.conclusao); k.pontos.forEach(p=>pdfTexto(doc,`• [${p.tema}] ${p.texto}`));
      pdfTabela(doc,'Proposições e leis parecidas',[['sem','Semelhança'],['ref','Proposição'],['autor','Autor'],['ementa','Ementa'],['sit','Situação']],
        k.parecidas.map(d=>({sem:Math.round(d.semelhanca*100)+'%', ref:`${d.tipo||''} ${d.numero||''}/${d.ano||''}`, autor:d.autor||'', ementa:d.ementa, sit:d.lei||d.situacao||''}))); }
    pdfTexto(doc,'Triagem automática. Confirme com a procuradoria ou a assessoria legislativa antes de protocolar.',9);
    await salvarPDF(doc,'Verificacao de proposicao'); });
  if (cfg.texto) irComLinhas();
}

async function renderProposicoes(){
  const e = esfera();

  y += gh + 26;

  doc.save(arq); aviso('PDF gerado: '+arq);

// ------------------------------------------------------------ Meus municípios: adicionar (coleta tudo), fixar no menu, remover
const ANO_ATUAL = new Date().getFullYear();
const ANOS_TODOS = Array.from({length: ANO_ATUAL - 2009}, (_, i) => ANO_ATUAL - i);   // de hoje até 2010
function situacaoMun(n, DS){
  const st = (MEUS.andamento||{}); const em = Object.entries(st).filter(([k])=>k.startsWith(n+'|'));
  if ((MEUS.atual||'').startsWith(n+'|') || (MEUS.fila||[]).includes(n)) { const u = (em.find(([k])=>k===MEUS.atual)||em.at(-1)||[,{}])[1]; return ['coletando', `coletando ${MEUS.atual&&MEUS.atual.endsWith('camara')?'Câmara':'Prefeitura'}… ${esc((u.ultima||'').slice(0,70))}`]; }
  const d = DS.filter(x=>x.municipio===n);
  if (!d.length) return ['sem', 'sem dados'];
  const lev = new Set(MEUS.leves||[]);
  return d.some(x=>!lev.has(x.id)) ? ['ok', `coletado · ${esc(periodosMun(n, DS))}`] : ['leve', 'só a coleta automática resumida (TCM-BA, PNCP)'];
}
function blocoMeus(DS, nomes){
  const L = MEUS.adicionados || [];
  return `<div class="painelzinho" style="margin-bottom:12px"><h3>Meus municípios <span class="note" style="font-weight:400">· ao adicionar, o programa coleta tudo da Prefeitura e da Câmara</span></h3>
    <div style="padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center">
      <input id="madd" list="lmun2" placeholder="Adicionar município da Bahia" style="font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);min-width:240px"><datalist id="lmun2">${nomes.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
      <label class="note">de <select id="madde">${ANOS_TODOS.map(a=>`<option ${a===ANO_ATUAL-1?'selected':''}>${a}</option>`).join('')}</select></label>
      <label class="note">até <select id="maddat">${ANOS_TODOS.map(a=>`<option>${a}</option>`).join('')}</select></label>
      <select id="maddent" aria-label="Órgãos"><option value="ambas">Câmara e Prefeitura</option><option value="prefeitura">Só a Prefeitura</option><option value="camara">Só a Câmara</option></select>
      <button class="more prim" id="maddb">Adicionar e coletar</button> <span class="note" id="maddst"></span></div>
    <p class="note" style="padding:0 14px 8px;margin:0">Os anos escolhidos são buscados só agora, ao adicionar. Períodos longos levam mais tempo.</p>
    ${L.length ? (()=>{
      // só aparecem os que estão em coleta (ou sem dados); quem termina fica 30 s como "já coletado" e sai (continua no "ver todos")
      let em = {}, fim = {}; try { em = JSON.parse(localStorage.getItem('f360-meus-coletando')||'{}'); fim = JSON.parse(localStorage.getItem('f360-meus-fim')||'{}'); } catch(_) {}
      const agora = Date.now(), vis = [];
      for (const n of L) { const c = situacaoMun(n, DS)[0];
        if (c === 'coletando') { em[n] = 1; delete fim[n]; vis.push(n); continue; }
        if (em[n] && (c === 'ok' || c === 'leve')) { fim[n] = agora; delete em[n]; }
        if (c === 'sem' || (fim[n] && agora - fim[n] < 30000)) vis.push(n); }
      try { localStorage.setItem('f360-meus-coletando', JSON.stringify(em)); localStorage.setItem('f360-meus-fim', JSON.stringify(fim)); } catch(_) {}
      for (const n of vis) if (fim[n]) setTimeout(()=>{ document.querySelectorAll(`[data-meulin="${CSS.escape(n)}"]`).forEach(e=>{ if (!e.closest('details.meustodos')) e.remove(); }); }, Math.max(0, 30000 - (agora - fim[n])));
      return vis.map(n=>linhaMeu(n, DS)).join('') + `<details class="meustodos" style="padding:4px 14px 10px"><summary class="note" style="cursor:pointer">Ver todos os meus municípios (${L.length})</summary>${L.map(n=>linhaMeu(n, DS)).join('')}</details>`;
    })()
      : '<p class="note" style="padding:0 14px 12px">Nenhum município na sua lista ainda. Adicione os que você quer acompanhar.</p>'}</div>`;
}
function linhaMeu(n, DS){ const [c,t] = situacaoMun(n, DS); const fix = (MEUS.fixados||[]).includes(n);
      return `<div class="lin" data-meulin="${esc(n)}" style="cursor:default"><span class="etq ${c==='ok'?'ok':c==='coletando'?'media':'info'}">${c==='coletando'?'coletando':c==='ok'?'já coletado':c==='leve'?'resumido':'sem dados'}</span>
        <span><b>${esc(n)}</b><br><span class="note">${t}</span></span>
        <span style="white-space:nowrap"><button class="mini" data-mabrir="${esc(n)}">Abrir</button> <button class="mini" data-mfix="${esc(n)}" title="${fix?'Tirar do menu lateral':'Colocar no menu lateral, como Lauro de Freitas'}">${fix?'Tirar do menu':'Fixar no menu'}</button> ${c==='sem'||c==='leve'?`<button class="mini" data-mcol="${esc(n)}">${c==='leve'?'Coletar completo':'Coletar'}</button> `:''}<button class="mini" data-mrem="${esc(n)}" title="Tira da sua lista (os dados coletados continuam no programa)">Remover</button></span></div>`;
}
function ligarMeus(DS, nomes, abrir){
  const post = async (acao, municipio, anos, entidades) => { const r = await fetch('/api/meus_municipios',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({acao, municipio, anos, entidades})}).then(r=>r.json()); MEUS = r; aplicarFixados(); montaTabs(); return r; };
  const ff = t => String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const nomeCerto = v => nomes.find(n=>ff(n)===ff(v));
  $('maddb').addEventListener('click', async ()=>{ const n = nomeCerto($('madd').value.trim()); if (!n) { $('maddst').textContent = 'Escolha um município da lista.'; return; }
    let de=+$('madde').value, ate=+$('maddat').value; if (de>ate) [de,ate]=[ate,de];
    const r0 = await post('adicionar', n, de===ate?String(de):`${de}-${ate}`, $('maddent').value); atualizarColetas();
    if (r0.nada_a_fazer) { aviso(r0.aviso); abrir(n); return; } if (r0.aviso) aviso(r0.aviso + ' O restante começou a ser coletado.'); else aviso(`${n} adicionado. A coleta completa começou; pode levar de alguns minutos a uma hora.`); abrir(n); });
  $('madd').addEventListener('keydown', e=>{ if(e.key==='Enter') $('maddb').click(); });
  $('main').querySelectorAll('[data-mabrir]').forEach(b=>b.addEventListener('click',()=>abrir(b.dataset.mabrir)));

  $('main').querySelectorAll('[data-mfix]').forEach(b=>b.addEventListener('click',async()=>{ const n=b.dataset.mfix; const fix=(MEUS.fixados||[]).includes(n); await post(fix?'desafixar':'fixar', n); aviso(fix?`${n} saiu do menu lateral.`:`${n} agora está no menu lateral.`); renderMunicipios(); }));
  $('main').querySelectorAll('[data-mrem]').forEach(b=>b.addEventListener('click',async()=>{ await post('remover', b.dataset.mrem); renderMunicipios(); }));
  atualizarColetas();
}


// ------------------------------------------------------------ Coletas em andamento (ficam no servidor: continuam visíveis ao sair e voltar)
async function atualizarColetas(){
  clearTimeout(atualizarColetas.t);
  const el = $('coletas'); if (!el) return;
  let C = []; try { C = await api('/api/coletas'); } catch(_) { return; }
  // concluídas somem 30 s depois de terminar; com erro ou interrompidas continuam (pedem ação)
  const problema = c => c.erro || /Interrompid/.test((c.etapas||[]).at(-1)||'');
  const ativos = C.filter(c=>c.ativo || c.na_fila), recentes = C.filter(c=>!c.ativo && !c.na_fila && (problema(c) || (c.fim_ha_s!=null && c.fim_ha_s <= 30))).slice(0,4);
  if (!ativos.length && !recentes.length) { el.innerHTML = ''; return; }
  const ent = e => e==='camara'?'Câmara':e==='prefeitura'?'Prefeitura':'';
  const abertas = atualizarColetas.abertas ||= new Set();   // fechadas por padrão; só ficam abertas as que você abrir
  const chave = c => `${c.municipio}|${c.entidade}|${c.inicio||''}`;
  const card = c => `<details class="grp" data-ck="${esc(chave(c))}" ${abertas.has(chave(c))?'open':''} style="margin:0 0 8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px">
      <summary style="cursor:pointer"><span class="etq ${c.ativo?'media':c.na_fila?'info':c.erro||/Interrompida/.test((c.etapas||[]).at(-1)||'')?'alta':'ok'}">${c.ativo?'coletando':c.na_fila?'na fila':c.erro?'com erro':/Interrompida antes/.test((c.etapas||[]).at(-1)||'')?'interrompida':/repetida interrompida/.test((c.etapas||[]).join(' '))?'já coletado':'concluída'}</span>
        <b>${esc(c.municipio)}</b> ${ent(c.entidade)?'· '+ent(c.entidade):''} <span class="note">${c.inicio?`· começou ${esc(c.inicio)}`:''}${c.ativo?` · rodando há ${c.minutos>=60?Math.floor(c.minutos/60)+' h '+(c.minutos%60)+' min':(c.minutos||0)+' min'}`:c.ultima_vez?` · terminou ${esc(c.ultima_vez)}`:''}</span>${!abertas.has(chave(c)) && (c.etapas||[]).length?`<br><small class="note" style="margin-left:4px">${esc(String((c.etapas||[]).at(-1)).trim().slice(0,140))}</small>`:''}</summary>
      <pre class="log" style="white-space:pre-wrap;font-size:.78rem;margin:8px 0 0;max-height:260px;overflow:auto">${esc((c.etapas||[]).join('\n'))}</pre>
      ${!c.ativo && !c.na_fila && !c.erro ? `<button class="mini" data-cabrir="${esc(c.municipio)}">Abrir ${esc(c.municipio)}</button>` : ''}</details>`;
  el.innerHTML = `<div class="painelzinho" style="margin-bottom:12px"><h3>Coletas ${ativos.length?`· ${ativos.length} em andamento`:''} <span class="note" style="font-weight:400">· continuam rodando se você sair desta tela</span></h3>
    <div style="padding:10px 14px">${ativos.map(card).join('')}${recentes.length?`<p class="note" style="margin:6px 0">Terminadas recentemente</p>${recentes.map(card).join('')}`:''}</div></div>`;
  el.querySelectorAll('details[data-ck]').forEach(d=>d.addEventListener('toggle',()=>{ d.open ? abertas.add(d.dataset.ck) : abertas.delete(d.dataset.ck); }));
  el.querySelectorAll('[data-cabrir]').forEach(b=>b.addEventListener('click',()=>{ try{ localStorage.setItem('fiscaliza360-municipio-nome', b.dataset.cabrir); localStorage.removeItem('fiscaliza360-municipio-ds'); }catch(_){} renderMunicipios(); }));
  if (ativos.length || recentes.some(c=>!problema(c))) atualizarColetas.t = setTimeout(()=>{ if (document.getElementById('coletas')) atualizarColetas(); }, ativos.length ? 8000 : 5000);
}


// anos já coletados de cada órgão do município
function anosMun(mun, DS){ return DS.filter(d=>d.municipio===mun).flatMap(d=>d.anos||[]).map(Number).filter(Boolean); }
function periodosMun(mun, DS){
  const L = DS.filter(d=>d.municipio===mun);
  if (!L.length) return '';
  const fx = a => { a = (a||[]).map(Number).sort(); return a.length ? (a[0]===a.at(-1) ? `${a[0]}` : `${a[0]} a ${a.at(-1)}`) : '?'; };
  return L.sort((a,b)=>a.entidade.localeCompare(b.entidade)).map(d=>`${d.entidade==='camara'?'Câmara':'Prefeitura'}: ${fx(d.anos)}${d.tem_pagamentos||d.tem_folha?'':' (resumido)'}`).join(' · ');
}

function contextoAlerta(A){
  const a=A.alerta, g=A.guia||{}, E=A.evidencias||{}, L=[];
  L.push(`ALERTA (${a.gravidade==='alta'?'grave':'atenção'}) · ${a.categoria}\n${a.titulo}\n${a.detalhe}`);
  if (E.probabilidade) L.push(`Probabilidade calculada pelo programa: ${E.probabilidade}`);
  if ((E.pontos||[]).length) L.push('Por que é alerta:\n' + E.pontos.map((p,i)=>`${i+1}. ${p}`).join('\n'));
  (E.secoes||[]).forEach(s=>{ L.push(`${s.titulo} (${s.rows.length} linha(s)${s.rows.length>40?', mostrando 40':''}):\n` +
    s.rows.slice(0,40).map(r=>s.cols.map(c=>`${c[1]}: ${r[c[0]]??''}`).join(' | ')).join('\n')); });
  L.push(`O que o alerta significa: ${g.explicacao||''}\nBase legal: ${(g.base_legal||[]).join('; ')}\nO que conferir: ${(g.verificar||[]).join('; ')}`);
  return L.join('\n\n').slice(0, 60000);
}
async function analiseIA(A, nova){
  const box=$('iaana'); if(!box) return;
  const a=A.alerta, chave='f360-analise-'+(a.chave||a.id);
  let H = []; try { H = JSON.parse(localStorage.getItem(chave)||'[]'); } catch(_) {}
  const md = window.f360md || (t=>esc(t).replace(/\n/g,'<br>'));
  const desenha = (escrevendo) => { box.hidden = !H.length;
    box.innerHTML = `<h3>Análise da IA <span class="note" style="font-weight:400">· pode pesquisar na internet · ${H.length?'feita em '+esc(H[0].quando||''):''}</span></h3>
      ${H.map(m=>m.papel==='voce'?`<p class="note" style="margin:10px 0 4px"><b>Pergunta:</b> ${esc(m.texto)}</p>`:`<div class="iaresp" style="line-height:1.55">${md(m.texto)}${escrevendo&&m===H[H.length-1]?'<span class="iacursor"></span>':''}</div>`).join('')}
      ${escrevendo?'':`<div class="bar" style="margin-top:10px"><input id="iaanaq" placeholder="Pergunte mais sobre este alerta ou peça para pesquisar algo…" style="flex:1 1 300px">
        <button class="more prim" id="iaanaenv">Perguntar</button><button class="more" id="iaananova">Refazer a análise</button></div>`}`;
    if (!escrevendo) {
      const ir = ()=>{ const q=$('iaanaq').value.trim(); if(q) pergunta(q); };
      $('iaanaenv').addEventListener('click', ir); $('iaanaq').addEventListener('keydown', e=>{ if(e.key==='Enter') ir(); });
      $('iaananova').addEventListener('click', ()=>{ H=[]; pergunta(null); });
    } };
  const pergunta = async (q) => {
    const inicial = !q;
    const texto = inicial ? `Analise a fundo este alerta. Use os dados enviados e, se ajudar, pesquise na internet (Diário Oficial, notícias, tribunais, sites oficiais). `
      + `Responda em tópicos curtos: (1) a suspeita em uma frase; (2) as explicações legais possíveis e se os dados confirmam, descartam ou não permitem saber cada uma; `
      + `(3) probabilidade de irregularidade (alta, média ou baixa) e por quê; (4) o que falta conferir e onde. Cite as fontes com links.` : q;
    const historico = H.filter(m=>!m.escrevendo).map(m=>({papel:m.papel==='voce'?'voce':'ia', texto:m.texto}));
    if (!inicial) H.push({papel:'voce', texto:q});
    const resp = {papel:'ia', texto:'', escrevendo:true, quando:new Date().toLocaleString('pt-BR').slice(0,16)}; H.push(resp);
    if (inicial) H[0].quando = resp.quando;
    desenha(true); box.scrollIntoView({behavior:'smooth', block:'start'});
    resp.texto = '_(lendo o alerta e as provas…)_\n\n';
    let ult = 0, ok = false;
    for (let tent = 0; tent < 4 && !ok; tent++) {   // se a conexão cair (programa reiniciando, internet), tenta de novo sozinho
      if (tent) { resp.texto = `_(a conexão caiu; tentando de novo — ${tent}ª vez…)_\n\n`; desenha(true); await new Promise(r=>setTimeout(r, [0,4000,8000,15000][tent])); }
      try {
        const r = await fetch('/api/ia/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pergunta:texto, historico, contexto:contextoAlerta(A), titulo:'Alerta: '+a.titulo, modo:'analise'})});
        if (!r.ok) throw new Error('HTTP '+r.status);
        const rd = r.body.getReader(), dec = new TextDecoder(); resp.texto = '';
        for (;;) { const {done, value} = await rd.read(); if (done) break; resp.texto += dec.decode(value,{stream:true});
          if (Date.now()-ult > 120) { ult = Date.now(); desenha(true); } }
        ok = true;
      } catch(e) { if (tent === 3) resp.texto = (resp.texto && !resp.texto.startsWith('_(') ? resp.texto + '\n\n' : '') + 'Não consegui falar com o programa depois de 4 tentativas. Confira se o Fiscaliza360 está aberto e clique em “Refazer a análise”.'; }
    }
    resp.texto = resp.texto.replace(/\n*_\((pesquisando na internet|lendo uma página)…\)_\n*/g, '\n\n').trim();   // tira os avisos de andamento
    delete resp.escrevendo;
    try { localStorage.setItem(chave, JSON.stringify(H)); } catch(_) {}
    desenha(false);
  };
  if (nova) { H = []; return pergunta(null); }
  if (H.length) desenha(false);
}

async function documentoPDF(B, tipo, A, nomeBase){

// ------------------------------------------------------------ PDF (jsPDF, funciona sem internet)
const hoje = () => new Date().toLocaleDateString('pt-BR');
// a fonte do PDF só tem os caracteres do português (Latin-1); símbolos fora dela (seta, triângulo, bolinha...) faziam
// a linha inteira sair com as letras espaçadas. Troca por equivalentes simples.
const PDF_TROCA = {'→':' > ','←':' < ','↑':'+','↓':'-','►':'> ','▶':'> ','●':'-','•':'-','✕':'x','✓':'ok',
  '≥':'>=','≤':'<=','−':'-','‑':'-','–':'-','—':' - ','…':'...','‘':"'",'’':"'",'“':'"','”':'"','€':'EUR'};
const pdfLimpa = s => String(s??'').replace(/\s*·?\s*(Fiscaliza360|Fiscaliza 360|Radar de Contas)\s*·?\s*/gi,' ').replace(/^\s+|\s+$/g,'').replace(/[^\x20-\x7e\xa1-\xff\n\t]/g, c => PDF_TROCA[c] ?? (/\s/.test(c) ? ' ' : ''));
const fmtPDF = (v,t) => pdfLimpa(t==='pg'||t==='cred' ? String(v??'') : String(fmt(v,t)));
function novoPDF(titulo, sub){ const {jsPDF}=window.jspdf; const doc=new jsPDF({orientation:'landscape',unit:'pt',format:'a4'});
  doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(20,90,110); const T=doc.splitTextToSize(pdfLimpa(titulo),760); doc.text(T,40,46);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(90,100,115); const S=doc.splitTextToSize(pdfLimpa(sub||''),760); const y=46+T.length*17; doc.text(S,40,y);
  if (/TSE/.test(sub||'')) doc._rodape = 'fonte: TSE (dados abertos) · eleições na Bahia';
  doc._y = y + 12*S.length + 6; return doc; }
function pdfTexto(doc, txt, size=9.5, bold=false){ doc.setFont('helvetica',bold?'bold':'normal'); doc.setFontSize(size); doc.setTextColor(27,35,48);
  const L=doc.splitTextToSize(pdfLimpa(txt),760); if(doc._y+L.length*12>560){doc.addPage();doc._y=40;} doc.text(L,40,doc._y+10); doc._y+=L.length*(size+3)+6; }
function pdfTabela(doc, titulo, cols, rows){ if(titulo){ if(doc._y>520){doc.addPage();doc._y=40;} pdfTexto(doc,titulo,11,true); }
  doc.autoTable({startY:doc._y, head:[cols.map(c=>c[1])], body:rows.map(r=>cols.map(c=>fmtPDF(r[c[0]],c[2]))),
    styles:{fontSize:cols.length>10?6.2:7.2,cellPadding:cols.length>10?2:3,overflow:'linebreak'}, headStyles:{fillColor:[20,90,110],textColor:255},
    alternateRowStyles:{fillColor:[243,245,242]}, margin:{left:40,right:40},
    columnStyles:Object.fromEntries(cols.map((c,i)=>[i,['$','n','p'].includes(c[2])?{halign:'right',cellWidth:'wrap'}:{}]))});
  doc._y=doc.lastAutoTable.finalY+16; }
function pdfLinks(doc, titulo, links){ if(!links.length) return; pdfTexto(doc,titulo,11,true); doc.setFontSize(8.5);
  for(const l of links){ if(doc._y>560){doc.addPage();doc._y=40;} doc.setTextColor(20,90,110); doc.textWithLink(String(l.t).slice(0,150),40,doc._y+8,{url:l.u}); doc._y+=13; } }
async function salvarPDF(doc, nome){ const n=doc.getNumberOfPages();
  const PW=doc.internal.pageSize.getWidth(), PH=doc.internal.pageSize.getHeight();
  const rod = pdfLimpa(doc._rodape || `Dados de ${M.gerado_em} · fontes: SEFAZ-BA (Dados Abertos / Portal da Transparência), Siconfi · indícios a verificar, não conclusões`);
  for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(120,128,140);
    doc.text(doc.splitTextToSize(rod, PW-140)[0], 40, PH-16);
    doc.text(`página ${i} de ${n}`, PW-40, PH-16, {align:'right'}); }
  nome=nome.replace(/[\\/:*?"<>|]+/g,'-').slice(0,120)+'.pdf'; doc.save(nome); aviso('PDF gerado: '+nome); }
function aviso(t){ let el=$('toast'); if(!el){el=document.createElement('div');el.id='toast';el.className='toast';document.body.appendChild(el);} el.textContent=t; el.hidden=false; clearTimeout(el._t); el._t=setTimeout(()=>el.hidden=true,5000); }

let tmUpd = null, versaoVista = null;
async function verStatus(){
  let st; try { st = await api('/api/status'); } catch(_) { tmUpd = setTimeout(verStatus, 60000); return; }
  // programa atualizado: recarrega sozinho (uma vez por versão). No celular não: lá o endereço "/" é a raiz do GitHub (dava 404)
  // e quem atualiza o app do celular é o celular.js, quando a versão nova é publicada.
  if (!window.F360_CELULAR && st.painel && st.painel > Date.parse(document.lastModified)/1000 + 2) {
    let ja=''; try { ja = sessionStorage.getItem('radar-bahia-recarregou')||''; } catch(_) {}
    if (ja !== String(st.painel)) { try { sessionStorage.setItem('radar-bahia-recarregou', String(st.painel)); } catch(_) {} location.replace(`/?v=${st.painel}${location.hash}`); return; }
  }
  const idade = st.horas < 1 ? 'há menos de 1 hora' : st.horas < 48 ? `há ${Math.round(st.horas)} h` : `há ${Math.round(st.horas/24)} dias`;
  const rap = st.rapido_em ? ` · alertas e pautas de ${esc(st.rapido_em.slice(-5))}` : '';
  $('upd').innerHTML = st.rodando
    ? `· <b style="color:var(--media)">${st.rapida?'atualizando alertas e pautas…':'atualizando agora…'}</b> <span title="${esc(st.linhas.join(' | '))}">${esc((st.linhas.at(-1)||'').trim().slice(0,70))}</span>`
    : `<span title="Dados de ${esc(st.gerado_em)}${esc(rap)}">Atualizado ${idade}</span> <button class="mini" id="btnUpd">Atualizar</button>${st.erro?' <b style="color:var(--alta)">a última atualização falhou</b>':''}`;
  const b = $('btnUpd'); if (b) b.onclick = async () => { await api('/api/atualizar'); aviso('Atualização completa iniciada. Você pode continuar usando o painel.'); verStatus(); };
  if (versaoVista && st.versao !== versaoVista) await novidades(st);
  versaoVista = st.versao;
  clearTimeout(tmUpd);
  tmUpd = setTimeout(verStatus, st.rodando ? 20000 : 60000);   // sem atualização em curso, confere a cada 3 minutos
}

// números dos quadros: diminuem até caber numa linha; só quebram se nem no menor tamanho legível couberem
(function(){
  const MIN = 12;   // px
  function ajustar(){
    document.querySelectorAll('.kpi b').forEach(b => {
      b.style.whiteSpace = 'nowrap'; b.style.fontSize = ''; b.classList.remove('quebra');
      let tam = parseFloat(getComputedStyle(b).fontSize) || 20;
      while (b.scrollWidth > b.clientWidth + 1 && tam > MIN) { tam -= 1; b.style.fontSize = tam + 'px'; }
      if (b.scrollWidth > b.clientWidth + 1) { b.style.whiteSpace = 'normal'; b.classList.add('quebra'); }
    });
  }
  let t; const agenda = () => { clearTimeout(t); t = setTimeout(ajustar, 60); };
  window.addEventListener('resize', agenda);
  new MutationObserver(agenda).observe(document.body, {childList: true, subtree: true});
  agenda();
})();

// quadro "Arrecadação": receita realizada x prevista (Siconfi), preenchido depois que a tela abre
async function preencherArrecadacao(raiz){
  for (const k of (raiz||document).querySelectorAll('.kpi-arrec:not([data-ok])')) {
    k.dataset.ok = '1';
    try {
      const r = await fetch('/api/arrecadacao?ente=' + encodeURIComponent(k.dataset.ente)).then(r=>r.json());
      const a = r.atual || r.anterior;
      if (!a) { k.querySelector('b').textContent = '—'; k.querySelector('small').textContent = 'sem relatório no Tesouro'; continue; }
      const brl0 = v => Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
      k.querySelector('span').textContent = `${k.querySelector('span').textContent.split(' em ')[0]} em ${a.ano}`;
      k.querySelector('b').textContent = brl0(a.realizado);
      k.querySelector('small').textContent = `${a.bimestre<6?`até o ${a.bimestre}º bimestre · `:''}${Math.round(a.pct||0)}% do previsto (${brl0(a.previsto)})${r.atual&&r.anterior?` · ${r.anterior.ano}: ${brl0(r.anterior.realizado)}`:''}`;
      k.title = `${r.fonte}. Previsto para ${a.ano}: ${brl0(a.previsto)}. Realizado${a.bimestre<6?' até o '+a.bimestre+'º bimestre':''}: ${brl0(a.realizado)}.`;
    } catch(e) { k.querySelector('b').textContent = '—'; k.querySelector('small').textContent = 'Tesouro fora do ar agora'; }
  }
}
new MutationObserver(()=>preencherArrecadacao()).observe(document.body, {childList:true, subtree:true});
// botões flutuantes que podem ser arrastados para qualquer canto (dedo ou mouse); a posição fica guardada neste aparelho
function arrastavel(el, chave){
  if (!el || el.dataset.arrastavel) return; el.dataset.arrastavel='1';
  const prende = (x,y) => { const r=el.getBoundingClientRect(), W=window.innerWidth, H=window.innerHeight;
    x=Math.max(6,Math.min(W-r.width-6,x)); y=Math.max(6,Math.min(H-r.height-6,y));
    Object.assign(el.style,{left:x+'px',top:y+'px',right:'auto',bottom:'auto'}); return [x,y]; };
  try { const p=JSON.parse(localStorage.getItem(chave)||'null'); if (p) requestAnimationFrame(()=>prende(p[0]*window.innerWidth, p[1]*window.innerHeight)); } catch(_) {}
  let ini=null;
  el.addEventListener('pointerdown', e=>{ const r=el.getBoundingClientRect(); ini={x:e.clientX,y:e.clientY,dx:e.clientX-r.left,dy:e.clientY-r.top,mov:false}; el.dataset.arrastou=''; });
  window.addEventListener('pointermove', e=>{ if(!ini) return;
    if (!ini.mov && Math.hypot(e.clientX-ini.x, e.clientY-ini.y) < 8) return;
    if (!ini.mov) { ini.mov=true; el.classList.add('arrastando'); try{ el.setPointerCapture(e.pointerId); }catch(_){} }
    e.preventDefault(); prende(e.clientX-ini.dx, e.clientY-ini.dy); }, {passive:false});
  const solta = ()=>{ if(!ini) return; if (ini.mov) { el.dataset.arrastou='1'; setTimeout(()=>el.dataset.arrastou='',300); el.classList.remove('arrastando');
      const r=el.getBoundingClientRect(); try{ localStorage.setItem(chave, JSON.stringify([r.left/window.innerWidth, r.top/window.innerHeight])); }catch(_){} }
    ini=null; };
  window.addEventListener('pointerup', solta); window.addEventListener('pointercancel', solta);
  window.addEventListener('resize', ()=>{ if (el.style.left) { const r=el.getBoundingClientRect(); prende(r.left, r.top); } });
}
window.f360Arrastavel = arrastavel;

.iasug{display:flex;flex-wrap:wrap;gap:6px}
.iasug button{font:inherit;font-size:.8rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 10px;cursor:pointer}
#iaform{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
#iatxt{flex:1;resize:none;font:inherit;font-size:.9rem;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);height:44px;max-height:120px}
#iaenv{font:inherit;font-weight:600;background:var(--gold-l);color:#1b2330;border:0;border-radius:8px;padding:0 14px;cursor:pointer}
#iaenv:disabled{opacity:.5;cursor:default}
#iacfg{padding:14px;overflow:auto;font-size:.88rem;display:flex;flex-direction:column;gap:10px}
#iacfg input,#iacfg select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box}
#iacfg ol{margin:0;padding-left:18px} #iacfg li{margin:3px 0}
.iacursor::after{content:'▍';animation:iapisca 1s steps(2) infinite} @keyframes iapisca{50%{opacity:0}}
</style>
<button id="iabtn" title="Pergunte à IA sobre o que está nesta tela"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Perguntar à IA</button>
<section id="iapainel" hidden aria-label="Assistente de IA">
  <header><b>Assistente IA<small id="iasub">sobre esta tela</small></b><button id="ialimpa" title="Nova conversa">⟲</button><button id="iafecha" title="Fechar">✕</button></header>
  <div id="iamsgs"></div>
  <div id="iacfg" hidden></div>
  <form id="iaform"><textarea id="iatxt" placeholder="Pergunte sobre esta tela… (Enter envia)"></textarea><button id="iaenv" type="submit">Enviar</button></form>
</section>
<script>
(function(){
  const conversas = {};   // uma conversa por tela
  let IA = null, ocupado = false;
  const chaveTela = () => { let ds=''; try{ ds = localStorage.getItem('fiscaliza360-municipio-ds')||''; }catch(_){} return atual + (atual==='municipios'||String(atual).startsWith('mun:') ? '|'+ds : ''); };
  const conv = () => (conversas[chaveTela()] ||= []);
  const md = t => { let h = esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[\s(])_(.+?)_(?=[\s).,;:!?]|$)/g,'$1<i>$2</i>');
    const out=[]; let lista=false;
    for (const l of h.split('\n')) { const m = l.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)$/);
      if (m) { if(!lista){out.push('<ul>');lista=true;} out.push('<li>'+m[1]+'</li>'); continue; }
      if (lista){out.push('</ul>');lista=false;} if (l.trim()) out.push('<p>'+l+'</p>'); }
    if (lista) out.push('</ul>'); return out.join(''); };
  function contexto(){
    const m = $('main'); let t = '';
    if (m) { const cl = m.cloneNode(true); cl.querySelectorAll('#coletas, iframe, script, style').forEach(e=>e.remove());   // o quadro de coletas muda o tempo todo
      cl.style.cssText='position:absolute;left:-99999px;top:0;width:1200px'; document.body.appendChild(cl); t = cl.innerText; cl.remove(); }
    try { const fr = $('mframe'); const d = fr && fr.contentDocument; if (d && d.body) t += '\n\n[Painel do município]\n' + d.body.innerText; } catch(_) {}
    return t.replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').slice(0, 180000);
  }
  function titulo(){ let s = document.title.replace(/ · Fiscaliza360$/,''); try{ const fr=$('mframe'); if(fr && fr.contentDocument) s += ' — ' + (fr.contentDocument.title||''); }catch(_){} return s; }
  function desenha(){
    const L = conv(), box = $('iamsgs'); $('iasub').textContent = 'sobre: ' + titulo();
    if (!L.length) { box.innerHTML = `<div class="iam ia"><p>Olá! Pergunte qualquer coisa sobre o que está <b>nesta tela</b>: um valor, uma conta, um alerta, um documento. Eu respondo usando os dados que estão aparecendo.</p></div>
      <div class="iasug">${['Explique os números desta tela','O que merece atenção aqui?','Que perguntas eu devo fazer à Mesa sobre isso?','Redija um requerimento sobre o ponto mais importante'].map(s=>`<button type="button">${esc(s)}</button>`).join('')}</div>`;
      box.querySelectorAll('.iasug button').forEach(b=>b.addEventListener('click',()=>enviar(b.textContent))); return; }
    box.innerHTML = L.map(m=>`<div class="iam ${m.papel}">${m.papel==='ia'?md(m.texto)+(m.escrevendo?'<span class="iacursor"></span>':''):esc(m.texto).replace(/\n/g,'<br>')}</div>`).join('');
    box.scrollTop = box.scrollHeight;
  }
  async function status(){ try { IA = await api('/api/ia/status'); } catch(_) { IA = {configurada:false}; } return IA; }
  function configView(abrir){
    const c = $('iacfg'); c.hidden = !abrir; $('iamsgs').hidden = abrir; $('iaform').hidden = abrir; if (!abrir) return desenha();
    const ms = (IA&&IA.modelos)||{'claude-opus-5-5':'Claude Opus 5.5'};
    c.innerHTML = `<b>Configurar a IA (Claude, da Anthropic)</b>
      <p class="note" style="margin:0">${IA&&IA.configurada?`Chave configurada (termina em <b>…${esc(IA.final_chave)}</b>).`:'Nenhuma chave configurada ainda.'}</p>
      <ol><li>No claude.ai: <b>Configurações → Cobrança → API credits → “Link organization”</b> (liga os créditos mensais de API do seu plano).</li>
      <li>Em <b>platform.claude.com</b>, nessa organização: <b>API keys → Create key</b>.</li><li>Cole a chave abaixo e salve.</li></ol>
      <label>Chave de API<input id="iachave" type="password" autocomplete="off" placeholder="sk-ant-…"></label>
      <label>Modelo<select id="iamodelo">${Object.entries(ms).map(([k,n])=>`<option value="${k}" ${IA&&IA.modelo===k?'selected':''}>${esc(n)}</option>`).join('')}</select></label>
      <div style="display:flex;gap:8px"><button class="more prim" id="iasalva" type="button">Salvar</button><button class="more" id="iavolta" type="button">Voltar</button>${IA&&IA.configurada?'<button class="more" id="iaremove" type="button">Remover chave</button>':''}</div>
      <p class="note" id="iacfgmsg" style="margin:0"></p>
      <p class="note" style="margin:0">A chave fica guardada só neste computador (não vai nas atualizações). Os dados da tela são enviados à Anthropic apenas quando você faz uma pergunta.</p>`;
    $('iavolta').addEventListener('click',()=>configView(false));
    const salvar = async corpo => { $('iacfgmsg').textContent='Conferindo com a Anthropic…';
      const r = await fetch('/api/ia/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(corpo)}).then(r=>r.json()).catch(e=>({erro:String(e)}));
      if (r.erro) { $('iacfgmsg').textContent = r.erro; return; } IA = r; $('iacfgmsg').textContent='Salvo.'; setTimeout(()=>configView(false), 700); };
    $('iasalva').addEventListener('click',()=>{ const k=$('iachave').value.trim(); salvar(k?{chave:k, modelo:$('iamodelo').value}:{modelo:$('iamodelo').value}); });
    if ($('iaremove')) $('iaremove').addEventListener('click',()=>salvar({chave:''}));
  }
  async function enviar(texto){
    texto = (texto||'').trim(); if (!texto || ocupado) return;
    if (!IA || !IA.configurada) { await status(); if (!IA.configurada) {   // sem chave ou sem o PC: avisa na própria conversa
      const L0 = conv(); L0.push({papel:'voce', texto}); $('iatxt').value='';
      L0.push({papel:'ia', texto: IA.precisa_pc || window.F360_CELULAR && !IA.modelo
        ? 'A IA responde pelo seu PC. Ligue o computador e abra o Fiscaliza360: em até 1 minuto o celular conecta e eu respondo aqui.'
        : 'A IA ainda não foi ativada: falta colar a chave da Anthropic no programa do seu PC, em **App do celular e senha** (é feito uma vez só). Depois disso eu respondo aqui, no computador e no celular.'});
      return desenha(); } }
    const L = conv(); const historico = L.filter(m=>!m.escrevendo).map(m=>({papel:m.papel, texto:m.texto}));
    L.push({papel:'voce', texto}); const resp = {papel:'ia', texto:'', escrevendo:true}; L.push(resp);
    ocupado = true; $('iaenv').disabled = true; $('iatxt').value = ''; desenha();
    try {
      const r = await fetch('/api/ia/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pergunta:texto, historico, contexto:contexto(), titulo:titulo()})});
      const rd = r.body.getReader(), dec = new TextDecoder(); let ult = 0;
      for (;;) { const {done, value} = await rd.read(); if (done) break; resp.texto += dec.decode(value,{stream:true});
        if (Date.now()-ult > 80) { ult = Date.now(); if (conv()===L) desenha(); } }
    } catch(e) {
      if (!resp.texto && !enviar._tentou) {   // caiu antes de começar (programa reiniciando, rede oscilando): tenta de novo sozinho
        enviar._tentou = true; L.splice(L.length-2, 2); ocupado = false; $('iaenv').disabled = false;
        resp.texto = 'Reconectando…'; desenha(); await new Promise(r=>setTimeout(r,4000)); const x = enviar(texto); enviar._tentou = false; return x; }
      resp.texto += (resp.texto?'\n\n':'') + 'A conexão caiu no meio da resposta. Toque em Enviar de novo.'; }
    enviar._tentou = false;
    resp.escrevendo = false; ocupado = false; $('iaenv').disabled = false; if (conv()===L) desenha();
  }
  arrastavel($('iabtn'), 'f360-pos-iabtn');
  // outras telas podem abrir o assistente já com uma pergunta (ex.: "Analisar a fundo" no alerta)
  window.f360md = md;
  window.f360PerguntarIA = texto => { $('iapainel').hidden=false; $('iabtn').hidden=true; configView(false); enviar(texto); };
  $('iabtn').addEventListener('click', async ()=>{ if ($('iabtn').dataset.arrastou==='1') return; $('iapainel').hidden=false; $('iabtn').hidden=true; configView(false); $('iatxt').focus(); status(); });
  $('iafecha').addEventListener('click', ()=>{ $('iapainel').hidden=true; $('iabtn').hidden=false; });
  $('ialimpa').addEventListener('click', ()=>{ conversas[chaveTela()] = []; configView(false); });
  $('iaform').addEventListener('submit', e=>{ e.preventDefault(); enviar($('iatxt').value); });
  $('iatxt').addEventListener('keydown', e=>{ if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); enviar($('iatxt').value); } });
  window.addEventListener('hashchange', ()=>{ if (!$('iapainel').hidden && $('iacfg').hidden) setTimeout(desenha, 300); });
})();
</script>
</body>
</html>
