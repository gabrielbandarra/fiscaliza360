<link rel="icon" href="icones/icone-24.png?v=3" sizes="24x24" type="image/png">
<link rel="icon" href="icones/icone-32.png?v=3" sizes="32x32" type="image/png">
<link rel="icon" href="icones/icone-48.png?v=3" sizes="48x48" type="image/png">
<link rel="icon" href="icones/icone-64.png?v=3" sizes="64x64" type="image/png">
<link rel="icon" href="icones/icone-192.png?v=3" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icones/icone-192.png?v=3">

<link rel="stylesheet" href="lib/fontes.css">
<style>
/* Fiscaliza360 — azul-marinho com dourado; menu lateral por área; cada aba é uma ficha com filtros, totais e tabela. */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --ink:#1b2330; --muted:#5d6675; --line:#d9ddd6;
  --accent:#0C447C; --accent-soft:#E6F1FB; --navy:#042C53; --gold:#BA7517; --gold-l:#EF9F27; --m:#3B6D11; --m-soft:#EAF3DE;
  --alta:#b3261e; --alta-soft:#fbe9e7; --media:#9a6000; --media-soft:#fdf1dc; --ok:#2e7d4f;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161c; --surface:#1a2029; --ink:#e6e9ee; --muted:#9aa3b0; --line:#2c3441;
  --accent:#85B7EB; --accent-soft:#0f2a47; --alta:#ff8a80; --alta-soft:#3a1f1e; --media:#f2b84b; --media-soft:#3a2f17; --ok:#7fd3a0; --navy:#031f3b; --m:#97C459; --m-soft:#1f2e12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161c; --surface:#1a2029; --ink:#e6e9ee; --muted:#9aa3b0; --line:#2c3441;
  --accent:#85B7EB; --accent-soft:#0f2a47; --alta:#ff8a80; --alta-soft:#3a1f1e; --media:#f2b84b; --media-soft:#3a2f17; --ok:#7fd3a0; --navy:#031f3b; --m:#97C459; --m-soft:#1f2e12; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;padding-block:14px 6px}
h1{font-size:1.15rem;margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.1rem;margin:0 0 4px}
.meta{color:var(--muted);font-size:.82rem}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
nav button{font:inherit;font-size:.88rem;font-weight:500;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:9px 12px;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:18px 48px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-width:0;overflow:hidden}
.kpi b{display:block;font-family:var(--sans);font-size:1.3rem;font-weight:600;letter-spacing:-.01em;line-height:1.25;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;margin-top:4px}
.kpi b.quebra{overflow:visible;overflow-wrap:anywhere}
.pref-faixa{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 8px;margin:0 0 10px;padding:9px 14px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;background:var(--surface)}.pref-faixa .pref-rot{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.pref-faixa .pref-nome{font-size:1.05rem}.pref-faixa .pref-partido{font-size:.78rem;font-weight:700;padding:1px 8px;border-radius:10px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent)}.pref-faixa .note{margin:0}.pref-faixa a{color:inherit;text-decoration:underline}
.kpi small{display:block;color:var(--muted);font-size:.74rem;margin-top:3px;line-height:1.35}
.painelzinho,.cert div,.grp,.res div,.lin span{min-width:0;overflow-wrap:anywhere}
.kpi span{color:var(--muted);font-size:.76rem;text-transform:uppercase;letter-spacing:.05em}
.kpi b.sm{font-family:var(--sans);font-size:.92rem;font-weight:600}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.bar input,.bar select{font:inherit;font-size:.92rem;padding:8px 10px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink);min-width:0;max-width:100%}
.bar input[type=search]{flex:1 1 260px}
.bar select{max-width:260px}
.sum{color:var(--muted);font-size:.85rem;margin:4px 0 8px}
.sum b{color:var(--ink);font-family:var(--mono);font-weight:500}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th{position:sticky;top:0;background:var(--surface);text-align:left;font-weight:600;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
th.ord{cursor:pointer}
th[data-dir="asc"]::after{content:" ▲"} th[data-dir="desc"]::after{content:" ▼"}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
td.w{min-width:240px;max-width:520px}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--accent-soft)}
a{color:var(--accent)}
.more{font:inherit;font-size:.88rem;padding:8px 14px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--accent);cursor:pointer;font-weight:600}
.more.prim{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.alert{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--media);border-radius:6px;padding:10px 14px;margin-bottom:8px;font:inherit;color:inherit;text-align:left;width:100%;cursor:pointer}
.alert:hover{border-color:var(--accent)}
.alert.alta{border-left-color:var(--alta)}
.pill{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:99px;background:var(--media-soft);color:var(--media);align-self:start;white-space:nowrap}
.alta .pill{background:var(--alta-soft);color:var(--alta)}
.alert p{margin:0} .alert .d{color:var(--muted);font-size:.85rem;grid-column:2}
.alert .c{color:var(--accent);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em}
.note{color:var(--muted);font-size:.84rem;max-width:80ch}
.grp h3{font-size:.95rem;margin:20px 0 6px}
.empty{padding:24px;color:var(--muted);text-align:center}
.mini{font:inherit;font-size:.76rem;padding:2px 8px;border:1px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:4px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
.res{display:grid;grid-template-columns:minmax(150px,240px) 1fr;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;margin:12px 0}
.res div{padding:7px 12px;border-bottom:1px solid var(--line);font-size:.88rem}
.res div:nth-child(odd){color:var(--muted)}
.res div:nth-last-child(-n+2){border-bottom:0}
ul.docs{margin:0;padding:10px 14px 10px 30px;font-size:.86rem;line-height:1.75;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.doshead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:6px}
.carregando{color:var(--muted);padding:24px;text-align:center}
.pauta .topo,span.topo{display:flex;align-items:center;gap:8px}
.pill.novo{background:var(--ok);color:var(--surface);margin-right:4px}
.pill.ant{background:var(--line);color:var(--muted);margin-right:4px}
.antigo{opacity:.78}
.quando{display:flex;flex-wrap:wrap;gap:4px 16px;margin:6px 0 0;font-family:var(--mono);font-size:.78rem;color:var(--ink)}
.quando span i{display:block;font-style:normal;font-family:var(--sans);font-size:.66rem;color:var(--muted)}
.alert .quando{grid-column:2}
.pill.g-info{background:var(--accent-soft);color:var(--accent)}
.pill.g-alta{background:var(--alta-soft);color:var(--alta)}
.pill.g-media{background:var(--media-soft);color:var(--media)}
.pauta.g-alta{border-top-color:var(--alta)} .pauta.g-media{border-top-color:var(--media)}
.pautas{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.pauta{font:inherit;color:inherit;text-align:left;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:6px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;position:relative}
.pauta:hover{border-color:var(--accent)}
.pauta b{font-size:1rem;line-height:1.3;padding-right:34px}
.pauta .c,span.c{color:var(--accent);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.pauta .rel{position:absolute;top:10px;right:12px;font-family:var(--mono);font-size:.78rem;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:1px 8px}
.pauta .nums{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--mono);font-size:.82rem}
.pauta .nums i{display:block;font-style:normal;font-family:var(--sans);font-size:.68rem;color:var(--muted);max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mdoc{font:inherit;color:inherit;text-align:left;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:6px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.mdoc:hover{border-color:var(--accent)} .mdoc b{font-size:1rem;line-height:1.3}
.mdoc .trecho{font-size:.84rem;color:var(--muted);border-left:3px solid var(--line);padding-left:8px}
.chip{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:1px 9px;font-size:.78rem;margin:2px 4px 2px 0}
.chip.dep{background:var(--media-soft);color:var(--media)}
.drop{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;border:2px dashed var(--line);border-radius:8px;padding:16px;background:var(--surface)}
.drop.sobre{border-color:var(--accent);background:var(--accent-soft)}
.envio{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.form select{font:inherit;font-size:.92rem;padding:8px 10px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink)}
.acoes{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.acao{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.acao .bar{margin:8px 0 0}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-top:8px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
.form input{font:inherit;font-size:.92rem;padding:8px 10px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink)}
.form label.chk{flex-direction:row;align-items:center;grid-column:1/-1;color:var(--ink)}
details.grp summary{cursor:pointer;margin:20px 0 6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:.88rem;z-index:20;max-width:calc(100% - 32px)}
@media (max-width:640px){.res{grid-template-columns:1fr}.res div:nth-child(odd){border-bottom:0;padding-bottom:0;font-size:.76rem;text-transform:uppercase}}

/* ---------- Fiscaliza360: menu lateral azul-marinho, barra superior com busca ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
#side{background:var(--navy);color:#E6F1FB;position:sticky;top:0;height:100vh;overflow-y:auto;padding:16px 10px;display:flex;flex-direction:column}
#side .marca{display:flex;align-items:center;gap:10px;padding:2px 8px 20px;text-decoration:none;color:#fff}
#side .marca .logo{width:34px;height:34px;flex:none}
#side .marca b{font-size:1.12rem;font-weight:600;letter-spacing:-.02em}
#side .marca b span{color:var(--gold-l)}
#side .marca small{display:block;font-size:.66rem;color:#85B7EB;font-weight:400;letter-spacing:.02em}
#side nav{display:flex;flex-direction:column;gap:2px}
#side .it{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;color:#B5D4F4;font:inherit;font-size:.91rem;padding:9px 11px;border-radius:7px;cursor:pointer;text-align:left}
#side .it svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#side .it:hover{background:rgba(255,255,255,.07);color:#fff}
#side .it[aria-current="page"]{background:#0C447C;color:#fff;box-shadow:inset 3px 0 0 var(--gold-l)}
#side .it .cont{margin-left:auto;background:var(--gold-l);color:#412402;border-radius:99px;font-size:.7rem;font-family:var(--mono);padding:0 7px;line-height:1.5}
#side .sec{font-size:.64rem;text-transform:uppercase;letter-spacing:.09em;color:#5b86b3;padding:14px 11px 4px}
#side .rod{margin-top:auto;padding:14px 10px 2px;font-size:.7rem;color:#6f97c2;line-height:1.5}
#topo{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
#topo .linha{display:flex;align-items:center;gap:14px;padding-block:12px 10px;flex-wrap:wrap}
#topo h1{font-size:1.18rem;font-weight:600;margin:0;letter-spacing:-.01em;white-space:nowrap}
#topo .busca{flex:1 1 280px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:0 10px;max-width:560px}
#topo .busca svg{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
#topo .busca input{border:0;background:none;font:inherit;font-size:.92rem;color:var(--ink);padding:9px 0;width:100%;outline:none}
#topo .busca kbd{font-family:var(--mono);font-size:.68rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
#topo .info{display:flex;flex-direction:column;align-items:flex-end;gap:2px;margin-left:auto}
#tabs:empty{display:none}
.esferas{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.esferas button{font:inherit;font-size:.8rem;font-weight:600;border:0;border-right:1px solid var(--line);background:var(--surface);color:var(--muted);padding:7px 11px;cursor:pointer;display:flex;align-items:center;gap:6px}
.esferas button:last-child{border-right:0}
.esferas button i{width:8px;height:8px;border-radius:50%;display:inline-block}
.esferas button[aria-checked="true"]{background:var(--navy);color:#fff}
.alert .esf{margin-right:6px}
@media (max-width:760px){.esferas{order:3;width:100%}.esferas button{flex:1;justify-content:center;padding:7px 4px}}
#tabs{border-top:1px solid var(--line)}
.esf{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;border-radius:99px;padding:1px 9px}
.esf.m{background:var(--m-soft);color:var(--m)} .esf.e{background:var(--accent-soft);color:var(--accent)} .esf.u{background:var(--media-soft);color:var(--media)}
.inicio-busca{background:var(--navy);color:#E6F1FB;border-radius:10px;padding:22px 22px 20px;margin-bottom:16px}
.inicio-busca h2{color:#fff;font-size:1.3rem;font-weight:600;margin:0 0 4px}
.inicio-busca p{margin:0 0 14px;color:#B5D4F4;font-size:.9rem}
.inicio-busca form{display:flex;gap:8px;flex-wrap:wrap}
.inicio-busca input{flex:1 1 280px;font:inherit;font-size:1rem;padding:12px 14px;border-radius:7px;border:0;background:#fff;color:#1b2330}
.inicio-busca button{font:inherit;font-weight:600;padding:12px 20px;border-radius:7px;border:0;background:var(--gold-l);color:#412402;cursor:pointer}
.atalhos{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.atalhos button{font:inherit;font-size:.8rem;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#E6F1FB;border-radius:99px;padding:4px 12px;cursor:pointer}
.duas{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.painelzinho{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.painelzinho h3{font-size:.95rem;margin:0;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.painelzinho h3 button{font:inherit;font-size:.78rem;background:none;border:0;color:var(--accent);cursor:pointer;font-weight:600}
.lin{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font:inherit;font-size:.86rem;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:inherit;cursor:pointer}
.lin:last-child{border-bottom:0} .lin:hover{background:var(--accent-soft)}
.lin .v{font-family:var(--mono);font-size:.8rem;color:var(--muted);white-space:nowrap}
.etq{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-radius:4px;padding:2px 7px;white-space:nowrap}
.etq.alta{background:var(--alta-soft);color:var(--alta)} .etq.media{background:var(--media-soft);color:var(--media)} .etq.info{background:var(--accent-soft);color:var(--accent)} .etq.ok{background:var(--m-soft);color:var(--m)}
.risco{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.risco svg{width:96px;height:96px;flex:none}
.cert{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.cert div{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:10px 12px;font-size:.84rem}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  #side{position:fixed;inset:auto 0 0 0;height:auto;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));z-index:10;flex-direction:row}
  #side .marca,#side .rod,#side .sec,#side .it.so-pc{display:none}
  #side nav{flex-direction:row;width:100%;justify-content:space-around;overflow-x:auto}
  #side .it{flex-direction:column;gap:2px;font-size:.62rem;padding:6px 6px;width:auto;min-width:56px;align-items:center}
  #side .it[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--gold-l)}
  #side .it .cont{position:absolute;margin:0 0 0 18px;font-size:.6rem}
  main{padding-bottom:96px}
  #topo .info{display:none}
}

.imp-destaque{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.imp-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.imp-card.grande{background:var(--navy);border-color:var(--navy);color:#E6F1FB}
.imp-topo{display:flex;align-items:center;justify-content:space-between;gap:8px}
.imp-tit{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.imp-card.grande .imp-tit{color:#85B7EB}
.imp-valor{font-family:var(--sans);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;font-size:clamp(1.4rem,3.2vw,2.5rem);line-height:1.15;margin:8px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:clip}
.imp-card.grande .imp-valor{color:var(--gold-l);font-size:clamp(1.7rem,3.6vw,2.9rem)}

<script>
// aviso "Carregando informações…" sempre que uma consulta demora mais de 0,4 s (para não parecer travado)
(function(){ const f0=window.fetch; let n=0, tm=null;
  const mostra=()=>{ const o=document.getElementById("ocupado"); if(o) o.hidden=!(n>0); };
  // sessão vencida ou programa reaberto: volta para a tela de senha
  const senha=r=>{ if(r && r.status===401 && !window.F360_CELULAR) location.href="/entrar.html?volta="+encodeURIComponent(location.pathname+location.search+location.hash); return r; };
  window.fetch=function(u,o){ const bg=typeof u==="string" && /\/api\/(status|coletas|meus_municipios|ia\/chat)|atualizarColetas/.test(u);
    if(bg) return f0.apply(this,arguments).then(senha);
    n++; clearTimeout(tm); tm=setTimeout(mostra,400);
    const fim=()=>{ n=Math.max(0,n-1); if(!n){ clearTimeout(tm); mostra(); } };
    return f0.apply(this,arguments).then(r=>{fim();return senha(r);},e=>{fim();throw e;}); };
})();
</script>

<script>
const $ = id => document.getElementById(id);
const brl = v => (v==null||v==='')?'':Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const br = d => d ? String(d).slice(0,10).split('-').reverse().join('/') : '';
// TELA muda a cada troca de aba: a resposta que chega depois que a pessoa saiu da aba é descartada (não escreve por cima da tela nova).
// Consultas de segundo plano (status, coletas, contadores, IA) sempre chegam.
let TELA = 0;
const API_FUNDO = /^\/api\/(status|coletas|coleta_bahia|meus_municipios|empresa\/alertas|ia\/|arrecadacao|celular|alertas$|pautas$|meta$)|^\/m\/api\/(datasets|municipios)$/;
const api = async (p, q={}) => { const u = new URL(p, location.origin); for (const [k,v] of Object.entries(q)) if (v!==''&&v!=null) u.searchParams.set(k,v);
  const t = TELA;
  let r;
  for (let tent = 0; ; tent++) {   // programa reiniciando (atualização) ou ocupado: tenta de novo por até ~30 s em vez de não abrir nada
    try { r = await fetch(u); if (r.status !== 502 && r.status !== 503) break; } catch(e) { if (tent >= 9) throw e; }
    if (tent >= 9) break;
    if (tent === 1 && window.aviso) aviso('O programa está reiniciando para aplicar uma atualização. Só um instante…');
    await new Promise(ok=>setTimeout(ok, 1000 + tent*500));
  }
  if(!r.ok) throw new Error(r.status); const j = await r.json();
  if (t !== TELA && !API_FUNDO.test(u.pathname)) return new Promise(()=>{});   // a aba mudou: a tela antiga para aqui
  return j; };
const PORTAL = 'https://www.transparencia.ba.gov.br';
const SEI = 'https://seibahia.ba.gov.br/sei/modulos/pesquisa/md_pesq_processo_pesquisar.php?acao_externa=protocolo_pesquisar&acao_origem_externa=protocolo_pesquisar&id_orgao_acesso_externo=0';
document.addEventListener('click', e => { const a = e.target.closest('[data-copiar]'); if (!a) return;
  try { navigator.clipboard.writeText(a.dataset.copiar); } catch(_) {}
  aviso('Número do processo copiado. Cole no campo “Nº do Processo” da pesquisa pública do SEI Bahia.'); });
let M = null;

const ORDEM = ['alertas','pautas','busca','meusdocs','deputados','emendas-destino','emendas','pagamentos','empenhos','credores','orgaos','contratos','licitacoes','convenios','diarias','projetos','emprestimos','orcamento','receitas','fiscal'];
let atual = decodeURIComponent(location.hash.slice(1).split('/')[0]) || 'inicio';
const estado = {};

function fmt(v, t, r){
  if (t==='$') return brl(v);
  if (t==='n') return v==null?'':Number(v).toLocaleString('pt-BR');
  if (t==='p') return v==null?'':Number(v).toLocaleString('pt-BR',{maximumFractionDigits:2})+'%';
  if (t==='d') return br(v);
  return v??'';
}
function cell(r,[k,_,t]){
  const v = r[k];
  if (t==='pg') return `<td>${v?`<a href="${PORTAL}/Pagamentos/Detalhe/${esc(v)}" target="_blank" rel="noopener" title="Abrir este pagamento no Portal da Transparência">${esc(v)}</a>`:''}</td>`;
  if (t==='ctr') return `<td>${v?`<button class="mini" data-abrir="contrato" data-ref="${esc(v)}">Abrir</button>`:''}</td>`;
  if (t==='lic') return `<td>${v?`<button class="mini" data-abrir="licitacao" data-ref="${esc(v)}">Abrir</button>`:''}</td>`;
  if (t==='conv') return `<td>${v?`<button class="mini" data-abrir="convenio" data-ref="${esc(v)}">Abrir</button>`:''}</td>`;
  if (t==='em') return `<td>${v?`<button class="mini" data-abrir="emenda" data-ref="${esc(v)}">Abrir</button>`:''}</td>`;
  if (t==='url') return `<td>${v?`<a href="/api/doc?u=${encodeURIComponent(v)}" target="_blank" rel="noopener">PDF</a>`:''}</td>`;
  if (t==='pvl') return `<td>${v?`<button class="mini" data-abrir="credito" data-ref="${esc(v)}">Abrir</button>`:''}</td>`;
  if (t==='prop') return `<td>${v?`<button class="mini" data-abrir="proposicao" data-ref="${esc(v)}">Abrir</button>`:''}</td>`;
  if (t==='sn') return `<td>${v==1?'sim':''}</td>`;
  if (t==='sei') return `<td style="white-space:nowrap">${v?`<a href="${SEI}" target="_blank" rel="noopener" data-copiar="${esc(v)}" title="Copia o número e abre a pesquisa pública do SEI Bahia">${esc(v)}</a>`:''}</td>`;
  if (t==='cred') return `<td>${v?`<a href="#" data-abrir="credor" data-ref="${esc(v)}">${esc(v)}</a>`:''}</td>`;
  if (t==='$'||t==='n'||t==='p') return `<td class="n">${fmt(v,t)}</td>`;
  if (t==='d') return `<td style="white-space:nowrap">${br(v)}</td>`;
  return `<td class="${t==='w'?'w':''}">${esc(v)}</td>`;
}

const areaDe = id => AREAS.find(a=>a.abas.includes(id)) || AREAS.find(a=>a.id==='estado');

  const ar = tipoDos ? (AREAS.find(a=>a.id===AREA_DOS[tipoDos]) || (typeof voltarPara!=='undefined' && voltarPara ? areaDe(voltarPara) : null) || AREAS.find(a=>a.id==='estado')) : areaDe(atual);

document.addEventListener('keydown', e => { if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k') { e.preventDefault(); $('qtopo').focus(); $('qtopo').select(); } });
// cada programa do menu é uma esfera: Lauro de Freitas, Municípios, Governo da Bahia (Estado) e União
const ESF_KEY = 'fiscaliza360-esfera';
const NOME_ESF = {municipio:'Municípios', estado:'Estado', uniao:'União', lauro:'Lauro de Freitas'};
const LAURO = 'Lauro de Freitas';
// filtro "só PT / PT e esquerda": partidos dos políticos citados (alertas e pautas)
function filtroPartido(lista, dica, id='fpt'){ const P = (M&&M.partidos)||{foco:['PT'],esquerda:[]}, f=P.foco.join('/');
  return `<select id="${id}" title="Partido dos políticos citados"><option value="">Partido: todos (${esc(dica)})</option><option value="@foco">Só ${esc(f)}</option><option value="@esq">${esc(f)} e esquerda</option><option value="@outros">Outros partidos</option>${[...new Set(lista.filter(Boolean))].sort().map(x=>`<option>${esc(x)}</option>`).join('')}</select>`; }
function okPartido(v, ps){ if (!v) return true; const P = (M&&M.partidos)||{foco:['PT'],esquerda:['PT']};
  if (v==='@foco') return ps.some(p=>P.foco.includes(p)); if (v==='@esq') return ps.some(p=>P.esquerda.includes(p)); if (v==='@outros') return ps.length>0 && !ps.some(p=>P.esquerda.includes(p)); return ps.includes(v); }
const ESFERA_AREA = {estado:'estado', lauro:'lauro', municipios:'municipio', uniao:'uniao'};
function esfera(){ if (String(atual).startsWith('mun:')) return 'municipio'; return ESFERA_AREA[areaDe(atual).id] || ''; }
const esfOk = x => { const e = esfera(); if (!e) return true; if (e === 'lauro') return x.esfera === 'municipio' ? x.municipio === LAURO : false; return (x.esfera||'estado') === e; };
const pilEsf = e => `<span class="esf ${e==='municipio'?'m':e==='uniao'?'u':'e'}">${e==='municipio'?'Município':(NOME_ESF[e]||'Estado')}</span>`;
function montaEsferas(){ $('esferas').innerHTML = ''; }
montaEsferas();
function abrirAlertaMun(x){ try { localStorage.setItem('fiscaliza360-municipio-ds', x.ds); localStorage.setItem('fiscaliza360-municipio-nome', x.municipio); } catch(_) {} window.__ALERTA_MUN = x.alerta_id; ir((MEUS.fixados||[]).includes(x.municipio) ? 'mun:'+x.municipio : 'municipios'); }
function buscarTudo(v){ const d=v.replace(/\D/g,''); if (d.length===14) return abrirDossie('empresa', d); (estado.busca ||= {q:''}).q = v; ir('busca'); }
$('tabs').addEventListener('click', e => { const b=e.target.closest('button'); if(!b) return; ir(b.dataset.id); });
function ir(id){ atual=id; try { localStorage.setItem('fiscaliza360-aba-'+areaDe(id).id, id); } catch(_) {} history.replaceState(null,'','#'+id); montaTabs(); show(); window.scrollTo(0,0); }
window.addEventListener('hashchange', ()=>{ const h=location.hash.slice(1); if(h.startsWith('dossie/')) return abrirHash(); atual=decodeURIComponent(h)||'inicio'; montaTabs(); show(); });
const R0br = v => Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});

      ${R.parlamentares.map(p=>`<tr><td><b>${esc(p.nome)}</b> <small class="note">${esc(p.partido)}-${esc(p.uf)}</small></td><td>${esc(p.casa)}</td><td style="text-align:right">${R0br(p.cota)}</td><td style="text-align:right">${p.x_media.toFixed(2).replace('.',',')}</td><td style="text-align:right">${p.posicao}º/${p.de}</td><td style="text-align:right">${p.graves?`<span class="etq alta">${p.graves} grave</span> `:''}${p.alertas}</td><td><small>${esc(p.tipos)}</small></td><td style="text-align:right">${R0br(p.pix)}</td><td><button class="mini" data-ia="${esc(p.nome)}|${esc(p.partido)}|${esc(p.uf)}|${esc(p.casa)}" title="Pesquisa na internet (usa créditos da IA)">Pesquisar denúncias</button></td></tr>`).join('')}</tbody></table></div></div>

    await salvarPDF(doc,`Relatorio ${titulo}`.slice(0,60)); });
}

      const r = await fetch('/api/trabalho/arquivo',{method:'POST',headers:{'X-Pauta':encodeURIComponent(pid),'X-Tipo':encodeURIComponent(tipo),'X-Nome':encodeURIComponent(f.name),'X-Descricao':encodeURIComponent(desc)},body:f}).then(r=>r.json()).catch(e=>({erro:String(e)}));
      if (r.erro) { msg.textContent = `${f.name}: ${r.erro}`; return; } }
    aviso(fs.length>1?`${fs.length} arquivos guardados.`:'Arquivo guardado.'); blocoArquivosPauta(pid, box); });
  box.querySelectorAll('[data-arqrem]').forEach(b=>b.addEventListener('click', async()=>{ if(!confirm('Remover este arquivo da pauta? Ele será apagado deste computador.')) return; await TRAB('arquivo_remover',{id:b.dataset.arqrem}); blocoArquivosPauta(pid, box); }));

async function enviarArquivosPauta(pid, lista, msg){   // lista: [[tipo, File], ...]
  for (const [i,[tipo,f]] of lista.entries()) { if (msg) msg.textContent = `Enviando ${i+1} de ${lista.length}: ${f.name} (${tamTxt(f.size)})…`;
    const r = await fetch('/api/trabalho/arquivo',{method:'POST',headers:{'X-Pauta':encodeURIComponent(pid),'X-Tipo':encodeURIComponent(tipo),'X-Nome':encodeURIComponent(f.name)},body:f}).then(r=>r.json()).catch(e=>({erro:String(e)}));
    if (r.erro) { if (msg) msg.textContent = `${f.name}: ${r.erro}`; return false; } }
  return true;
}
async function criarPauta(id){

  const lista = [...form.querySelectorAll('[data-arq]')].flatMap(i=>[...i.files].map(f=>[i.dataset.arq,f]));
  const ok = await enviarArquivosPauta(r.pid, lista, $(id+'msg'));
  aviso(lista.length ? (ok ? `Criado com ${lista.length} arquivo(s).` : 'Criado, mas um arquivo não foi enviado; envie de novo na tela do vídeo.') : 'Criado. Envie o roteiro e os documentos na tela do vídeo.');

function cardsPauta(p){
  const ex = $('tpextra'), A = assinatura();
  const nums = (p.numeros||[]);
  ex.innerHTML = `<div style="margin-top:10px"><h4 style="margin:0 0 6px">Cards para redes sociais</h4>
    <div class="tform"><label class="tcampo largo"><span>Título do card</span><textarea id="cdt" rows="2">${esc(p.manchete)}</textarea></label>
      <label class="tcampo"><span>Número em destaque</span><select id="cdn">${nums.map(([k,v],i)=>`<option value="${i}">${esc(k)}: ${esc(v)}</option>`).join('')}<option value="-1">nenhum</option></select></label>
      <label class="tcampo"><span>Assinatura</span><input id="cda" value="${esc([A.nome,A.rede].filter(Boolean).join(' · ')||'Fiscalização com dados oficiais')}"></label>
      <label class="tcampo"><span>Cor</span><select id="cdc"><option value="auto">pela gravidade</option><option value="#b42318">vermelho</option><option value="#b54708">laranja</option><option value="#0b3d75">azul</option><option value="#101828">preto</option></select></label></div>
    <div class="bar"><button class="more prim" id="cdfeed">Baixar card do feed (1080×1350)</button><button class="more" id="cdstory">Baixar capa de Reels/Stories (1080×1920)</button><button class="more" id="cdquad">Baixar card quadrado (1080×1080)</button></div>
    <canvas id="cdprev" style="max-width:260px;border:1px solid var(--line);border-radius:6px;display:block"></canvas></div>`;
  const cor = () => { const c=$('cdc').value; return c!=='auto' ? c : p.gravidade==='alta' ? '#b42318' : p.gravidade==='media' ? '#b54708' : '#0b3d75'; };
  const quebra = (ctx, t, larg) => { const pal = String(t).split(/\s+/), L=[]; let l=''; for (const w of pal) { const n = l ? l+' '+w : w; if (ctx.measureText(n).width > larg && l) { L.push(l); l = w; } else l = n; } if (l) L.push(l); return L; };
  const desenha = (W, Hh) => { const cv = document.createElement('canvas'); cv.width=W; cv.height=Hh; const x = cv.getContext('2d'); const C = cor(), M = 80;
    x.fillStyle = '#ffffff'; x.fillRect(0,0,W,Hh); x.fillStyle = C; x.fillRect(0,0,W,24); x.fillRect(0,Hh-170,W,170);
    x.fillStyle = C; x.font = '700 34px "IBM Plex Sans", Arial, sans-serif'; x.fillText(String(p.tema||'').toUpperCase().slice(0,48), M, 110);
    let y = 190; const tt = $('cdt').value; let fs = 76; x.font = `800 ${fs}px "IBM Plex Sans", Arial, sans-serif`; let L = quebra(x, tt, W-2*M);
    while (L.length > (Hh>1500?8:6) && fs > 44) { fs -= 4; x.font = `800 ${fs}px "IBM Plex Sans", Arial, sans-serif`; L = quebra(x, tt, W-2*M); }
    x.fillStyle = '#101828'; L.forEach(l=>{ x.fillText(l, M, y); y += fs*1.15; });
    const ni = +$('cdn').value; if (ni >= 0 && nums[ni]) { y += 40; x.fillStyle = C; x.font = '800 96px "IBM Plex Sans", Arial, sans-serif'; quebra(x, nums[ni][1], W-2*M).slice(0,2).forEach(l=>{ x.fillText(l, M, y+80); y += 100; });
      x.fillStyle = '#475467'; x.font = '500 36px "IBM Plex Sans", Arial, sans-serif'; quebra(x, nums[ni][0], W-2*M).slice(0,2).forEach(l=>{ x.fillText(l, M, y+110); y += 44; }); }
    if (p.linha_fina && y < Hh-420) { x.fillStyle = '#344054'; x.font = '400 34px "IBM Plex Sans", Arial, sans-serif'; y += 140; quebra(x, p.linha_fina, W-2*M).slice(0, Hh>1500?6:3).forEach(l=>{ x.fillText(l, M, y); y += 46; }); }
    x.fillStyle = '#ffffff'; x.font = '700 38px "IBM Plex Sans", Arial, sans-serif'; x.fillText($('cda').value.slice(0,60), M, Hh-95);
    x.font = '400 26px "IBM Plex Sans", Arial, sans-serif'; x.fillText('Fonte: dados públicos oficiais · indício para apuração', M, Hh-50);
    return cv; };
  const baixa = (W,Hh,nome) => desenha(W,Hh).toBlob(b=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`${nome} - ${p.manchete.slice(0,50).replace(/[\\/:*?"<>|]/g,'')}.png`; a.click(); });
  const prev = () => { const c = desenha(1080,1350), pv = $('cdprev'); if (!pv) return; pv.width = 270; pv.height = 337; pv.getContext('2d').drawImage(c,0,0,270,337); };
  ['cdt','cda'].forEach(k=>$(k).addEventListener('input',prev)); ['cdn','cdc'].forEach(k=>$(k).addEventListener('change',prev));
  $('cdfeed').addEventListener('click',()=>baixa(1080,1350,'card feed')); $('cdstory').addEventListener('click',()=>baixa(1080,1920,'capa reels')); $('cdquad').addEventListener('click',()=>baixa(1080,1080,'card quadrado'));
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(prev);
}

// ============================================================ MAPA DA BAHIA
async function renderMapa(){
  $('main').innerHTML = '<p class="carregando">Montando o mapa…</p>';
  const [D, G] = await Promise.all([api('/api/mapa'), fetch('lib/bahia_municipios.geojson').then(r=>r.json())]);
  const st = renderMapa.st || (renderMapa.st = {ind:'emendas_est'});
  const porI = Object.fromEntries(D.municipios.map(m=>[m.ibge, m]));
  // projeção simples (a Bahia é pequena o bastante): x = longitude × cos(latitude média), y = -latitude
  let mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9; const cosl = Math.cos(-12.5*Math.PI/180);
  const pts = g => g.type==='Polygon' ? [g.coordinates] : g.coordinates;
  G.features.forEach(f=>pts(f.geometry).forEach(p=>p.forEach(an=>an.forEach(([lo,la])=>{ const x=lo*cosl, y=-la; mnx=Math.min(mnx,x); mxx=Math.max(mxx,x); mny=Math.min(mny,y); mxy=Math.max(mxy,y); }))));
  const W=900, Hh=Math.round(W*(mxy-mny)/(mxx-mnx)), k=W/(mxx-mnx);
  const caminho = f => pts(f.geometry).map(p=>p.map(an=>'M'+an.map(([lo,la])=>`${((lo*cosl-mnx)*k).toFixed(1)},${((-la-mny)*k).toFixed(1)}`).join('L')+'Z').join('')).join('');
  const IND = D.indicadores, ind = () => IND.find(i=>i.id===st.ind)||IND[0];

// ============================================================ PDF de qualquer tela (para as telas sem PDF próprio)
// Lê o que está na tela: títulos, quadros de números, tabelas, listas e textos, e monta um PDF organizado.
async function pdfDaTela(){
  const main = $('main'), tit = (main.querySelector('h2')||{}).textContent || NOME_ABA[atual] || areaDe(atual).nome || 'Fiscaliza360';
  const doc = novoPDF(`${areaDe(atual).nome} · ${NOME_ABA[atual]||tit}`.slice(0,140), `o que estava na tela em ${new Date().toLocaleString('pt-BR')}`);
  doc._rodape = 'dados públicos oficiais · indícios a verificar, não conclusões';
  const limpa = t => String(t||'').replace(/\s+/g,' ').trim();
  const visivel = el => el.offsetParent !== null || el.tagName==='DETAILS';
  const kpis = el => { const L=[...el.querySelectorAll('.kpi')].map(k=>({r:limpa((k.querySelector('span')||{}).textContent), v:limpa((k.querySelector('b')||{}).textContent), d:limpa((k.querySelector('small')||{}).textContent)})); if (L.length) pdfTabela(doc,'',[['r','Indicador'],['v','Valor'],['d','Detalhe']],L); };
  const tabela = (t, titulo) => { const cab=[...t.querySelectorAll('thead th')].map(th=>limpa(th.textContent)); const linhas=[...t.querySelectorAll('tbody tr')].filter(visivel).map(tr=>[...tr.children].map(td=>limpa(td.textContent)));
    if (!linhas.length) return; const n = Math.max(cab.length, ...linhas.map(l=>l.length)); const cols=[...Array(n)].map((_,i)=>[String(i), cab[i]||'']);
    pdfTabela(doc, titulo||'', cols, linhas.slice(0,3000).map(l=>Object.fromEntries(l.map((v,i)=>[String(i),v])))); };
  const anda = el => { for (const n of el.children) { if (!visivel(n) || n.matches('.doshead,.bar,button.more,select,input,svg,canvas,script,style,#iabtn,.pdfbar')) continue;
      const t = n.tagName;
      if (n.classList.contains('kpis')) { kpis(n); continue; }
      if (t==='TABLE') { tabela(n); continue; }
      if (/^H[1-4]$/.test(t)) { pdfTexto(doc, limpa(n.textContent), t==='H2'?13:11, true); continue; }
      if (t==='P') { const x=limpa(n.textContent); if (x) pdfTexto(doc, x, 9); continue; }
      if (t==='UL'||t==='OL') { for (const li of n.children) pdfTexto(doc, '• '+limpa(li.textContent), 9); continue; }
      if (n.matches('button.lin, button.alert, button.pauta, .lin, .kcard')) { const x=limpa(n.textContent); if (x) pdfTexto(doc, '• '+x, 8.5); continue; }
      if (n.children.length) anda(n); else { const x=limpa(n.textContent); if (x) pdfTexto(doc, x, 9); } } };
  anda(main);
  await salvarPDF(doc, `${NOME_ABA[atual]||tit}`.slice(0,60));
}
(function(){   // coloca o botão "Baixar PDF desta tela" em toda tela que não tem um PDF próprio
  let tm; const obs = new MutationObserver(()=>{ clearTimeout(tm); tm = setTimeout(()=>{ const m = $('main'); if (!m || m.querySelector('.pdfbar') || m.querySelector('.carregando')) return;
    const tem = [...m.querySelectorAll('button')].some(b=>/pdf/i.test(b.textContent)); if (tem) return;
    if (!m.textContent.trim()) return;
    m.insertAdjacentHTML('afterbegin','<div class="pdfbar" style="display:flex;justify-content:flex-end;margin:0 0 6px"><button class="more" data-pdftela>Baixar PDF desta tela</button></div>'); }, 700); });
  document.addEventListener('DOMContentLoaded', ()=>{ const m=$('main'); if (m) obs.observe(m, {childList:true}); });
  if ($('main')) obs.observe($('main'), {childList:true});
  document.addEventListener('click', e=>{ if (e.target.closest('[data-pdftela]')) pdfDaTela(); });
})();

// ------------------------------------------------------------------ comprovação oficial (dívida ativa, punição, pagamentos)
// Para alertas sobre empresa: busca nas bases oficiais as provas da denúncia e gera o PDF de comprovação.
async function comprovacaoOficial(a, alvo, opts) {
  const ref = typeof a.ref === 'string' ? a.ref : '';
  const doc = ref.split('|')[0].replace(/\D/g, '').slice(0, 14) || String((a.ref && (a.ref.cnpj || a.ref.cnpj_cpf)) || '').replace(/\D/g, '');
  if (!doc || doc.length < 11 || !alvo) return;
  const punicao = /punid|CEIS|CNEP|inid/i.test(a.categoria + ' ' + ref), divida = /d[íi]vida ativa|pgfn/i.test(a.categoria + ' ' + ref);
  const desde = punicao ? ((ref.split('|')[2] || '').slice(0, 10)) : '';
  const box = document.createElement('div'); box.className = 'grp comprova';
  box.innerHTML = '<h3>Comprovação oficial</h3><p class="note">Buscando nas bases oficiais (PGFN, CGU, Receita Federal e pagamentos)…</p>';
  alvo.parentNode.insertBefore(box, alvo.nextSibling);
  let C;
  try { C = await fetch(`/api/comprovantes?doc=${doc}&ds=${encodeURIComponent((opts && opts.ds) || '')}&desde=${desde}`).then(r => r.json()); }
  catch (e) { box.innerHTML = '<h3>Comprovação oficial</h3><p class="note">A comprovação é montada pelo programa no computador. Abra este alerta com o Fiscaliza360 aberto no PC.</p>'; return; }
  if (C.erro) { box.innerHTML = `<h3>Comprovação oficial</h3><p class="note">${esc(C.erro)}</p>`; return; }
  const R = v => Number(v || 0).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
  const B = s => s ? String(s).slice(0, 10).split('-').reverse().join('/') : '';

function docsOficiaisAlerta(A, depois){
  const a = A.alerta, d = A.base || {}, cat = a.categoria || '', txt = (a.titulo||'') + ' ' + (a.detalhe||'');
  const cn = (String(a.ref||'').split('|').map(x=>x.replace(/\D/g,'')).find(x=>x.length===14) || (String(a.ref||'').match(/\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}/)||[''])[0].replace(/\D/g,'') || '');
  const L = [];
  const ext = (fontes, t, nomes) => L.push({t, u:`/api/extrato?fontes=${fontes}&doc=${cn}` + (nomes&&nomes.length?'&nomes='+encodeURIComponent(nomes.join('|')):''), f:'Arquivo oficial ('+fontes.toUpperCase().replace(/,/g,', ')+')', ext:true});
  if (cn) {
    if (/d[íi]vida ativa/i.test(cat)) L.push({t:'PGFN · Dívida Ativa da União · extrato do arquivo oficial de dados abertos (linhas originais, sem alteração)', u:'/api/pgfn_oficial?doc='+cn, f:'PGFN (arquivo oficial)', ext:true});
    if (/punid/i.test(cat)) ext('cgu,tcu','CGU/TCU · registro oficial da punição (linhas originais do CEIS/CNEP/TCU: processo, órgão, datas, abrangência)');
    if (/campanha/i.test(cat) && !/s[óo]cio/i.test(cat)) ext('tse','TSE · prestação de contas: serviço prestado à campanha (linhas originais)');
    if (/s[óo]cio.*doou/i.test(cat)) ext('tse,receita','TSE e Receita · doação do sócio e quadro de sócios da empresa (linhas originais)', [...new Set([...txt.matchAll(/([A-ZÀ-Ý][A-ZÀ-Ý' ]{6,80}?) doou R\$/g)].map(m=>m[1].trim()))]);
    if (/nome de pol[íi]tico/i.test(cat)) ext('receita,tse','Receita e TSE · sócio e candidatura com o mesmo nome (linhas originais)');
    if (/embargo|ambiental/i.test(cat)) ext('ibama','IBAMA · termo de embargo ambiental (linha original do arquivo oficial)');
    if (/escravo|an[áa]log/i.test(cat)) ext('escravo','Ministério do Trabalho · Cadastro de Empregadores (lista suja): trecho do PDF oficial');
    if (/endere[çc]o|aberta pouco|baixad|inapt|MEI/i.test(cat)) ext('receita','Receita Federal · cadastro oficial do CNPJ: situação, abertura, endereço e sócios (linhas originais)');
    L.push({t:'Portal da Transparência (CGU) · sanções e ficha do CNPJ', u:`https://portaldatransparencia.gov.br/sancoes/consulta?cpfCnpj=${cn}`, f:'CGU'});
  }
  const tr = a.tipo_ref || '', rf = String(a.ref || '');
  if ((a.esfera||'estado')==='estado' && /^(contrato|convenio|licitacao)$/.test(tr) && rf)
    L.unshift({t:`SEFAZ-BA · Portal de Dados Abertos · linhas originais do ${tr==='licitacao'?'processo de licitação (fornecedores e itens)':tr==='convenio'?'convênio (parcelas, pagamentos e prestação de contas)':'contrato (aditivos, fiscais, documentos, pagamentos e processo SEI)'}`, u:'/api/extrato?fontes=sefaz&doc='+encodeURIComponent(rf), f:'Arquivo oficial (SEFAZ-BA)', ext:true});
  if ((a.esfera||'estado')==='estado' && tr==='diaria' && rf.includes('|'))
    L.unshift({t:'SEFAZ-BA · Portal de Dados Abertos · linhas originais dos pagamentos de diárias ao servidor', u:'/api/extrato?fontes=sefaz&nomes='+encodeURIComponent(rf.split('|')[0]), f:'Arquivo oficial (SEFAZ-BA)', ext:true});
  for (const x of d.docs || []) L.push({t:x.t, u:x.u, f:'Documento do caso (fonte oficial)', pdf:true});
  for (const s of ((A.evidencias||{}).secoes || [])) for (const r of s.rows || []) { if (r.url && /^https?:/.test(r.url)) L.push({t:`${s.titulo}: nota de ${br(r.data||'')} · ${brl(r.valor)}`, u:r.url, f:'Câmara dos Deputados (nota fiscal)', pdf:true}); }
  const vistos = new Set(); const U = L.filter(l=>!vistos.has(l.u) && vistos.add(l.u));
  const box = document.createElement('div'); box.className = 'grp'; box.id = 'docsof';
  const temDoc = U.some(l=>l.ext||l.pdf);
  box.innerHTML = `<h3>Documentos oficiais que comprovam este alerta · ${U.length}</h3>${temDoc?'':'<p style="background:#fef3f2;border-left:4px solid #b42318;padding:8px 10px;margin:6px 0"><b>⚠ Ainda sem documento oficial anexado.</b> Não use este alerta em denúncia, vídeo ou matéria antes de obter o documento (peça por LAI, botão abaixo).</p>'}
    <p class="note">Extratos literais dos arquivos públicos oficiais (abra e use “Imprimir / salvar em PDF”) e os documentos do próprio caso. ${U.length?'':'Nenhum documento oficial ligado automaticamente a este alerta: peça cópia por LAI (botão abaixo).'}</p>
    ${U.length?`<div class="tbl"><table><thead><tr><th>Documento</th><th>Fonte</th><th></th></tr></thead><tbody>${U.slice(0,150).map(l=>`<tr><td>${esc(l.t)}</td><td><small>${esc(l.f)}</small></td><td style="white-space:nowrap"><a class="more" href="${esc(l.u)}" target="_blank" rel="noopener">${l.ext?'Abrir e salvar em PDF':l.pdf?'Baixar PDF':'Abrir site'}</a></td></tr>`).join('')}</tbody></table></div>`:''}`;
  if (depois) depois.parentNode.insertBefore(box, depois.nextSibling);
}

// ---- comparativo entre duas candidaturas (mesma pessoa em anos diferentes, ou dois candidatos)
const tsePct = (a,b) => a ? Math.round(1000*(b-a)/a)/10 : null;
const tseNB = s => (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function tseUne(LA, LB, chave, rot){   // junta duas listas pelo nome (bairros/locais mudam de código entre eleições)
  const m = {};
  LA.forEach(x=>{ const k=tseNB(chave(x)); const o=(m[k] ||= {nome:rot(x), a:0, b:0, va:0, vb:0}); o.a+=x.votos; o.va+=x.validos||0; });
  LB.forEach(x=>{ const k=tseNB(chave(x)); const o=(m[k] ||= {nome:rot(x), a:0, b:0, va:0, vb:0}); o.b+=x.votos; o.vb+=x.validos||0; });
  return Object.values(m).map(o=>Object.assign(o,{dif:o.b-o.a, var:tsePct(o.a,o.b), pa:o.va?100*o.a/o.va:null, pb:o.vb?100*o.b/o.vb:null}))
    .sort((x,y)=>(y.a+y.b)-(x.a+x.b));
}
function tseAnalise(c){
  const {ka, kb, LM, BA, temMun, nomeAlvo, mesmoCargo, novos, perdidos, vA, vB} = c;
  const n = v => Number(v||0).toLocaleString('pt-BR'), sg = v => (v>0?'+':'')+n(v), pc = v => v==null?'':v.toLocaleString('pt-BR',{maximumFractionDigits:1})+'%';
  const nome = ka.urna||ka.nome, dif = kb.votos-ka.votos, varp = ka.votos ? 100*dif/ka.votos : null;
  const S = [];
  let resumo = `De ${ka.ano} (${ka.cargo.toLowerCase()}) para ${kb.ano} (${kb.cargo.toLowerCase()}), ${nome} passou de ${n(ka.votos)} para ${n(kb.votos)} votos (${sg(dif)}${varp!=null?', '+(varp>0?'+':'')+varp.toFixed(1).replace('.',',')+'%':''}).`;
  if (mesmoCargo && ka.posicao && kb.posicao) resumo += ` Na disputa, foi de ${ka.posicao}º para ${kb.posicao}º lugar${kb.posicao<ka.posicao?' (subiu)':kb.posicao>ka.posicao?' (caiu)':''}.`;
  resumo += ` Resultado: ${(ka.resultado||'').toLowerCase()} → ${(kb.resultado||'').toLowerCase()}.`;
  if (!mesmoCargo) resumo += ' Como os cargos são diferentes, a comparação mais justa é a fatia dos votos válidos em cada lugar (quanto do eleitorado de cada bairro votou em você).';
  // bairros
  const B = BA.filter(x=>x.nome && x.nome!=='Bairro não informado');
  const totA = B.reduce((s,x)=>s+x.a,0), totB = B.reduce((s,x)=>s+x.b,0);
  const conc = (L,k,t) => t ? 100*L.slice().sort((x,y)=>y[k]-x[k]).slice(0,3).reduce((s,x)=>s+x[k],0)/t : null;
  const cA = conc(B,'a',totA), cB = conc(B,'b',totB);
  const fortes = B.filter(x=>x.b>0 && x.dif>=0).sort((x,y)=>y.b-x.b).slice(0,5);
  const cresceu = B.filter(x=>x.dif>0).sort((x,y)=>y.dif-x.dif).slice(0,6);
  const caiu = B.filter(x=>x.dif<0).sort((x,y)=>x.dif-y.dif).slice(0,6);
  const conquistados = B.filter(x=>!x.a && x.b>0).sort((x,y)=>y.b-x.b).slice(0,5);
  const abandonados = B.filter(x=>x.a>0 && !x.b).sort((x,y)=>y.a-x.a).slice(0,5);
  const fatiaCaiu = B.filter(x=>x.pa!=null && x.pb!=null && x.pb < x.pa-1 && x.a>=20).sort((x,y)=>(x.pb-x.pa)-(y.pb-y.pa)).slice(0,5);
  const grandes = B.filter(x=>x.vb>0).sort((x,y)=>y.vb-x.vb), corte = grandes[Math.floor(grandes.length/4)] ? grandes[Math.floor(grandes.length/4)].vb : 0;
  const fatias = B.filter(x=>x.pb!=null).map(x=>x.pb).sort((a,b)=>a-b), med = fatias.length ? fatias[Math.floor(fatias.length/2)] : 0;
  const oport = grandes.filter(x=>x.vb>=corte && x.pb!=null && x.pb<=med).slice(0,5);
  const lb = x => `${x.nome}: ${n(x.a)} → ${n(x.b)} (${sg(x.dif)})${x.pa!=null&&x.pb!=null?`, fatia dos válidos ${pc(x.pa)} → ${pc(x.pb)}`:''}`;
  if (fortes.length) S.push({titulo:`Pontos fortes em ${nomeAlvo} (redutos mantidos ou ampliados)`, cor:'#1f7a3d', itens:fortes.map(lb), rows:fortes, tipo:'tab'});
  if (cresceu.length) S.push({titulo:`Onde mais cresceu em ${nomeAlvo}`, cor:'#1f7a3d', itens:cresceu.map(lb), rows:cresceu, tipo:'tab'});
  if (conquistados.length) S.push({titulo:'Bairros conquistados (sem voto antes, com voto agora)', cor:'#1f7a3d', rows:conquistados, tipo:'tab', itens:conquistados.map(x=>`${x.nome}: ${n(x.b)} votos${x.pb!=null?' ('+pc(x.pb)+' dos válidos)':''}`)});
  if (caiu.length) S.push({titulo:`Pontos fracos: onde mais perdeu votos em ${nomeAlvo}`, cor:'#b42318', itens:caiu.map(lb), rows:caiu, tipo:'tab'});
  if (abandonados.length) S.push({titulo:'Bairros perdidos (tinha voto antes, zerou agora)', cor:'#b42318', rows:abandonados, tipo:'tab', itens:abandonados.map(x=>`${x.nome}: tinha ${n(x.a)} votos`)});
  if (fatiaCaiu.length) S.push({titulo:'Atenção: a fatia do eleitorado caiu (concorrência mais forte ou menos presença)', cor:'#b54708', itens:fatiaCaiu.map(lb), rows:fatiaCaiu, tipo:'tab'});
  if (oport.length) S.push({titulo:'Oportunidades: bairros grandes onde a sua fatia ainda é pequena', cor:'#0f5c8a', rows:oport, tipo:'tab', itens:oport.map(x=>`${x.nome}: ${n(x.vb)} votos válidos no bairro e você teve ${n(x.b)} (${pc(x.pb)})`)});
  if (cA!=null && cB!=null) S.push({titulo:'Concentração do voto', itens:[`Os 3 maiores bairros somavam ${pc(cA)} dos seus votos em ${nomeAlvo} em ${ka.ano} e ${pc(cB)} em ${kb.ano}. ${cB>cA+5?'O voto ficou mais concentrado: depende mais de poucos bairros (risco se um deles cair).':cB<cA-5?'O voto ficou mais espalhado pela cidade: base mais diversificada.':'A distribuição ficou parecida.'}`]});
  // municípios (eleições estaduais/federais)
  if (temMun) {
    const M = LM.filter(x=>x.nome);
    const mc = M.filter(x=>x.dif>0).sort((x,y)=>y.dif-x.dif).slice(0,6), mq = M.filter(x=>x.dif<0).sort((x,y)=>x.dif-y.dif).slice(0,6);
    const lm = x => `${x.nome}: ${n(x.a)} → ${n(x.b)} (${sg(x.dif)})${x.pa!=null&&x.pb!=null?`, fatia ${pc(x.pa)} → ${pc(x.pb)}`:''}`;
    const totMB = M.reduce((s,x)=>s+x.b,0), maior = M.slice().sort((x,y)=>y.b-x.b)[0];
    if (mc.length) S.push({titulo:'Municípios onde mais cresceu', cor:'#1f7a3d', itens:mc.map(lm), rows:mc, tipo:'tab'});
    if (mq.length) S.push({titulo:'Municípios onde mais perdeu', cor:'#b42318', itens:mq.map(lm), rows:mq, tipo:'tab'});
    if (novos.length) S.push({titulo:`Municípios novos (${novos.length}): os maiores`, cor:'#1f7a3d', rows:novos.slice().sort((x,y)=>y.b-x.b).slice(0,10), tipo:'tab', itens:novos.slice().sort((x,y)=>y.b-x.b).slice(0,6).map(x=>`${x.nome}: ${n(x.b)} votos`)});
    if (perdidos.length) S.push({titulo:`Municípios sem voto agora (${perdidos.length}): os que mais pesavam`, cor:'#b42318', rows:perdidos.slice().sort((x,y)=>y.a-x.a).slice(0,10), tipo:'tab', itens:perdidos.slice().sort((x,y)=>y.a-x.a).slice(0,6).map(x=>`${x.nome}: tinha ${n(x.a)} votos`)});
    if (maior && totMB) S.push({titulo:'Dependência da base principal', itens:[`${maior.nome} deu ${pc(100*maior.b/totMB)} dos votos de ${kb.ano}. ${100*maior.b/totMB>50?'Mais da metade vem de um só município: crescer no interior é o caminho para ampliar.':'Os votos estão distribuídos entre vários municípios.'}`]});
  }
  // recomendações
  const R = [];
  if (fortes.length) R.push(`Manter e reforçar a presença nos redutos: ${fortes.slice(0,3).map(x=>x.nome).join(', ')}.`);
  if (caiu.length) R.push(`Recuperar onde mais perdeu: ${caiu.slice(0,3).map(x=>`${x.nome} (${sg(x.dif)})`).join(', ')} — vale entender o que mudou (lideranças, concorrentes, presença).`);
  if (abandonados.length) R.push(`Retomar contato nos bairros onde a votação zerou: ${abandonados.slice(0,3).map(x=>x.nome).join(', ')}.`);
  if (oport.length) R.push(`Expandir nos bairros grandes com fatia pequena: ${oport.slice(0,3).map(x=>x.nome).join(', ')} — maior potencial de novos votos.`);
  if (temMun) { const mq = LM.filter(x=>x.dif<0).sort((x,y)=>x.dif-y.dif).slice(0,3); if (mq.length) R.push(`No interior, priorizar a recuperação em ${mq.map(x=>x.nome).join(', ')}.`);
    const nv = novos.slice().sort((x,y)=>y.b-x.b).slice(0,3); if (nv.length) R.push(`Consolidar os municípios conquistados: ${nv.map(x=>x.nome).join(', ')}.`); }
  if (cA!=null && cB!=null && cB>cA+5) R.push('Diversificar a base: o voto ficou concentrado em poucos bairros.');
  if (R.length) S.push({titulo:'O que fazer: manter e melhorar', cor:'#0f5c8a', itens:R, tipo:'acoes'});
  return {resumo, secoes:S};
}

async function renderTSEEleicoes(esf){
  const st = (estado['tse-'+esf] ||= {ano:String(ANOS_ESF[esf][0]), cargo:CARGOS_ESF[esf][CARGOS_ESF[esf].length-1], mun:'', q:''});
  const [S, O] = await Promise.all([api('/api/tse/status').catch(()=>({})), api('/api/tse/opcoes').catch(()=>({municipios:[]}))]);
  $('main').innerHTML = `${tseStatusNota(S)}
    <div class="bar" style="flex-wrap:wrap"><select id="eano">${ANOS_ESF[esf].map(a=>`<option ${String(a)===st.ano?'selected':''}>${a}</option>`).join('')}</select>
      <select id="ecargo">${CARGOS_ESF[esf].map(c=>`<option ${c===st.cargo?'selected':''}>${c}</option>`).join('')}</select>
      ${esf==='municipal'?`<input list="emuns" id="emun" placeholder="Município (ex.: Lauro de Freitas)" value="${esc(st.mun)}" style="max-width:260px"><datalist id="emuns">${(O.municipios||[]).map(m=>`<option value="${esc(m.nome)}">`).join('')}</datalist>`:''}
      <input type="search" id="eq" placeholder="Filtrar por nome ou partido" value="${esc(st.q)}" style="max-width:240px"><button class="more pdf" id="epdf">Baixar PDF</button></div>
    <div id="eres"></div><div id="edet"></div>`;
  let L = [];
  const desenha = () => { const f=($('eq').value||'').toLowerCase(); st.q=$('eq').value;
    const R = L.filter(x=>!f || (x.urna+' '+x.nome+' '+x.partido).toLowerCase().includes(f));
    const el = L.filter(x=>x.eleito).length, tot = L.reduce((s,x)=>s+(x.votos||0),0);
    $('eres').innerHTML = L.length ? `<p class="note">${L.length} candidato(s) · ${el} eleito(s) · ${N0(tot)} votos nominais. Clique para ver onde cada um foi votado.</p>
      <div class="tbl"><table><thead><tr><th>#</th><th>Candidato</th><th>Partido</th>${esf==='municipal'?'':'<th style="text-align:right">Municípios</th>'}<th style="text-align:right">Votos</th><th>Resultado</th></tr></thead><tbody>
      ${R.map((x,i)=>`<tr data-esq="${esc(x.sq)}" style="cursor:pointer"><td>${x.posicao||''}</td><td><b>${esc(x.urna||x.nome)}</b> <small class="note">${esc(x.nome)}</small></td><td>${esc(x.partido||'')}</td>${esf==='municipal'?'':`<td style="text-align:right">${N0(x.n_municipios)}</td>`}<td style="text-align:right">${N0(x.votos)}${x.votos_t2?` <small class="note">(2º t: ${N0(x.votos_t2)})</small>`:''}</td><td><span class="etq ${x.eleito?'info':'media'}">${esc((x.resultado||'').toLowerCase())}</span></td></tr>`).join('')}</tbody></table></div>`
      : (esf==='municipal'&&!st.mun ? '<p class="note">Escolha o município.</p>' : '<p class="empty">Sem dados para essa escolha (o ano pode estar sendo baixado).</p>');
    $('eres').querySelectorAll('[data-esq]').forEach(tr=>tr.addEventListener('click',()=>tseCandidatura(st.ano, tr.dataset.esq, null, 'edet'))); };
  const carrega = async () => { st.ano=$('eano').value; st.cargo=$('ecargo').value; st.mun=$('emun')?$('emun').value.trim():''; $('edet').innerHTML='';
    if (esf==='municipal' && !st.mun) { L=[]; return desenha(); }
    $('eres').innerHTML='<p class="carregando">Carregando informações…</p>';
    L = await api('/api/tse/eleicao',{ano:st.ano, cargo:st.cargo, municipio:st.mun}).catch(()=>[]); desenha(); };
  $('eano').addEventListener('change',carrega); $('ecargo').addEventListener('change',carrega);
  if ($('emun')) { let tm; $('emun').addEventListener('input',()=>{ clearTimeout(tm); tm=setTimeout(()=>{ if(!$('emun').value.trim() || (O.municipios||[]).some(m=>m.nome.toLowerCase()===$('emun').value.trim().toLowerCase())) carrega(); },350); }); }
  $('eq').addEventListener('input',()=>{ $('edet').innerHTML=''; desenha(); });
  $('epdf').addEventListener('click',async()=>{ const f=($('eq').value||'').toLowerCase(); const R=L.filter(x=>!f || (x.urna+' '+x.nome+' '+x.partido).toLowerCase().includes(f));

    pdfTabela(doc,'',[['p','#'],['u','Candidato'],['n','Nome completo'],['pt','Partido'],...(esf==='municipal'?[]:[['m','Municípios']]),['v','Votos'],['r','Resultado']],
      R.map(x=>({p:x.posicao||'',u:x.urna||x.nome,n:x.nome,pt:x.partido||'',m:N0(x.n_municipios),v:N0(x.votos)+(x.votos_t2?' (2º t: '+N0(x.votos_t2)+')':''),r:(x.resultado||'').toLowerCase()})));
    await salvarPDF(doc,`Eleição ${st.ano} ${st.cargo}${st.mun?' '+st.mun:''}`); });
  carrega();
}

const FP = {estado:{q:'',orgao:'',mes:'',cargo:'',pag:0}, uniao:{q:'',orgao:'',mes:'',cargo:'',pag:0}};
async function renderFolhaPublica(esf){
  const st = FP[esf], tela = TELA;
  const fonte = esf==='estado'
    ? 'Fonte: Governo da Bahia, dados abertos (dados.ba.gov.br, “Dados de Servidores” – remuneração). O Estado publica o nome abreviado e o CPF parcial.'
    : 'Fonte: Portal da Transparência do Governo Federal (CGU), servidores civis do SIAPE com exercício na Bahia. CPF parcial, como publicado.';
  $('main').innerHTML = `<p class="note">${fonte} Cada linha é o contracheque do mês: bruto (salário + 13º + férias + eventuais), abate-teto, descontos (IRRF, previdência e outros) e líquido, mais as verbas indenizatórias, que não entram no teto.</p>
    <div class="bar"><input type="search" id="fp-q" placeholder="Nome do servidor" value="${esc(st.q)}" style="flex:2 1 220px"><input type="search" id="fp-c" placeholder="Cargo ou função" value="${esc(st.cargo)}">
      <select id="fp-o"><option value="">Órgão: todos</option></select><select id="fp-m"><option value="">Mês: todos</option></select>
      <button class="more prim" id="fp-ok">Buscar</button><button class="more pdf" id="fp-pdf">Baixar PDF</button></div>
    <div id="fp-res"><p class="carregando" style="padding:12px">Carregando…</p></div>`;
  const ler = () => { st.q=$('fp-q').value.trim(); st.cargo=$('fp-c').value.trim(); st.orgao=$('fp-o').value; st.mes=$('fp-m').value; };
  const desc = x => Math.abs(x.irrf||0)+Math.abs(x.previdencia||0)+Math.abs(x.outros_descontos||0);
  const buscar = async () => {
    const [mm, aa] = (st.mes||'/').split('/');
    const r = await api('/api/folha_publica',{esfera:esf, q:st.q, cargo:st.cargo, orgao:st.orgao, ano:aa||'', mes:mm||'', pagina:st.pag}).catch(e=>({erro:e.message}));
    if (tela !== TELA) return;
    if (r.erro && !(r.linhas||[]).length) { $('fp-res').innerHTML = `<p class="empty">${esc(r.erro==='folha ainda não baixada'?'A folha oficial está sendo baixada agora (a primeira vez leva alguns minutos). Volte daqui a pouco.':r.erro)}</p>`; return; }
    if ($('fp-o').options.length<=1) {
      $('fp-o').innerHTML = '<option value="">Órgão: todos</option>' + r.orgaos.map(o=>`<option ${o===st.orgao?'selected':''}>${esc(o)}</option>`).join('');
      $('fp-m').innerHTML = '<option value="">Mês: todos</option>' + r.meses.map(m=>`<option ${m===st.mes?'selected':''}>${m}</option>`).join('');
    }
    FP[esf].ult = r;
    const lin = r.linhas.map(x=>`<tr><td>${String(x.mes).padStart(2,'0')}/${x.ano}</td><td><b>${esc(x.nome)}</b><br><span class="note">${esc(x.cpf||'')} · mat. ${esc(x.matricula||'')}</span></td>
      <td>${esc(x.cargo||'')}${x.funcao?`<br><span class="note">${esc(x.funcao)}</span>`:''}</td><td>${esc(x.orgao||'')}<br><span class="note">${esc(x.vinculo||'')}${x.situacao?' · '+esc(x.situacao):''}</span></td>
      <td class="n">${brl(x.bruto)}${(x.decimo||x.ferias||x.outras)?`<br><span class="note">${x.decimo?'13º '+brl(x.decimo)+' ':''}${x.ferias?'férias '+brl(x.ferias)+' ':''}${x.outras?'eventuais '+brl(x.outras):''}</span>`:''}</td>
      <td class="n">${x.abate_teto?brl(x.abate_teto):'—'}</td><td class="n">${brl(desc(x))}<br><span class="note">IR ${brl(Math.abs(x.irrf||0))} · prev. ${brl(Math.abs(x.previdencia||0))}</span></td>
      <td class="n"><b>${brl(x.liquido)}</b></td><td class="n">${x.indenizacoes?brl(x.indenizacoes):'—'}</td></tr>`).join('');
    $('fp-res').innerHTML = `<div class="kpis"><div class="kpi"><span>Contracheques encontrados</span><b>${r.total.toLocaleString('pt-BR')}</b></div><div class="kpi"><span>Soma do bruto</span><b>${brl(r.soma_bruto)}</b></div><div class="kpi"><span>Soma do líquido</span><b>${brl(r.soma_liquido)}</b></div><div class="kpi"><span>Atualizado em</span><b class="sm">${esc((r.meta&&r.meta.atualizado||'').replace('T',' '))}</b></div></div>
      <div class="tbl"><table><thead><tr><th>Mês</th><th>Servidor</th><th>Cargo / função</th><th>Órgão / vínculo</th><th>Bruto</th><th>Abate-teto</th><th>Descontos</th><th>Líquido</th><th>Indenizações</th></tr></thead><tbody>${lin||'<tr><td colspan="9" class="empty">Nada encontrado.</td></tr>'}</tbody></table></div>
      <p class="note">Mostrando ${r.linhas.length} de ${r.total.toLocaleString('pt-BR')} (maiores salários brutos primeiro). ${r.total>(st.pag+1)*300?'<button class="more" id="fp-mais">Próximos 300</button>':''}${st.pag?' <button class="more" id="fp-ant">Anteriores</button>':''}</p>`;
    if ($('fp-mais')) $('fp-mais').addEventListener('click',()=>{ st.pag++; buscar(); });
    if ($('fp-ant')) $('fp-ant').addEventListener('click',()=>{ st.pag--; buscar(); });
  };
  $('fp-ok').addEventListener('click',()=>{ ler(); st.pag=0; buscar(); });
  ['fp-q','fp-c'].forEach(i=>$(i).addEventListener('keydown',e=>{ if(e.key==='Enter'){ ler(); st.pag=0; buscar(); } }));
  ['fp-o','fp-m'].forEach(i=>$(i).addEventListener('change',()=>{ ler(); st.pag=0; buscar(); }));
  $('fp-pdf').addEventListener('click', async()=>{ const r=FP[esf].ult; if(!r) return;
    const filtros=[st.q&&'nome: '+st.q, st.cargo&&'cargo: '+st.cargo, st.orgao&&'órgão: '+st.orgao, st.mes&&'mês: '+st.mes].filter(Boolean).join(' · ');
    const doc=novoPDF(`Contracheques destrinchados · ${esf==='estado'?'Governo da Bahia':'servidores federais na Bahia'}`, `${r.total} contracheque(s)${filtros?' · '+filtros:''} · bruto ${brl(r.soma_bruto)} · líquido ${brl(r.soma_liquido)} · ${fonte}`);
    pdfTabela(doc,'',[['comp','Mês'],['nome','Servidor'],['cargo','Cargo'],['orgao','Órgão'],['bruto','Bruto','$'],['abate_teto','Abate-teto','$'],['desc','Descontos','$'],['liquido','Líquido','$'],['indenizacoes','Indenizações','$']],
      r.linhas.map(x=>({...x, comp:`${String(x.mes).padStart(2,'0')}/${x.ano}`, desc:desc(x)})));
    await salvarPDF(doc, `Contracheques ${esf==='estado'?'Estado':'União'}${filtros?' - '+filtros:''}`); });
  buscar();
}

async function tabela(id){
  const t = M.tabs[id]; const st = estado[id] ||= {q:'', f:{}, ord:t.ordem, lim:200};
  $('main').innerHTML = `${t.nota?`<p class="note">${t.nota}</p>`:''}
    <div class="bar"><input type="search" id="q" placeholder="Pesquisar nome, CNPJ, órgão, objeto, município…" value="${esc(st.q)}">
    <span id="filtros"></span><button class="more" id="pdf">Baixar PDF</button><button class="more" id="xls" title="Abre no Excel">Planilha</button></div>
    <div class="sum" id="sum">…</div>
    <div class="tbl"><table><thead><tr>${t.cols.map(c=>`<th class="ord" data-k="${c[0]}" ${st.ord[0]===c[0]?`data-dir="${st.ord[1]}"`:''}>${esc(c[1])}</th>`).join('')}</tr></thead><tbody id="tb"></tbody></table></div>
    <button class="more" id="mais" hidden>Mostrar mais</button>`;
  // filtros (valores vêm do banco)
  Promise.all(t.filtros.map(k=>api('/api/opcoes',{t:id,col:k}).then(v=>[k,v]))).then(L=>{
    $('filtros').innerHTML = L.map(([k,vals])=>{ const nome=(t.cols.find(c=>c[0]===k)||[k,k==='ano'?'Ano':k.replace(/_/g,' ')])[1];
      if (k==='ano') { const tem = new Set(vals.map(String)); const todos = Array.from({length:new Date().getFullYear()-2009},(_,i)=>String(new Date().getFullYear()-i));
        return `<select data-k="ano" aria-label="Ano"><option value="">Ano: todos</option>${todos.map(v=>tem.has(v)?`<option ${String(st.f.ano??'')===v?'selected':''}>${v}</option>`:`<option value="buscar:${v}">${v} (buscar)</option>`).join('')}</select>`; }
      return `<select data-k="${k}" aria-label="${esc(nome)}"><option value="">${esc(nome)}: todos</option>${vals.map(v=>`<option ${String(st.f[k]??'')===String(v)?'selected':''}>${esc(v)}</option>`).join('')}</select>`; }).join(' ');
    $('filtros').querySelectorAll('select').forEach(s=>s.addEventListener('change',async()=>{
      if (s.value.startsWith('buscar:')) { const ano = s.value.slice(7); s.value = st.f[s.dataset.k] || '';
        if (!confirm(`Os dados de ${ano} ainda não estão no programa. Buscar agora no Portal da Transparência da Bahia?\n\nA busca roda em segundo plano (de 20 minutos a 1 hora) e o ano passa a fazer parte das próximas atualizações. Você pode continuar usando o programa.`)) return;
        const r = await fetch('/api/estado/ano',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ano:+ano})}).then(r=>r.json());
        aviso(r.erro ? r.erro : r.iniciada ? `Buscando ${ano}. Quando terminar, o ano aparece no filtro.` : `${ano} entra na atualização que já está em andamento ou na próxima.`); verStatus(); return; }
      st.f[s.dataset.k]=s.value; st.lim=200; draw();}));
  });
  let seq=0;
  const params = () => ({t:id, q:st.q, ord:st.ord[0], dir:st.ord[1], ...Object.fromEntries(Object.entries(st.f).map(([k,v])=>['f.'+k,v]))});
  const draw = async () => {
    const my=++seq; $('sum').textContent='pesquisando…';
    const r = await api('/api/tabela',{...params(), lim:st.lim}); if(my!==seq) return;
    if (r.erro) { $('sum').textContent = r.erro; return; }
    st.rows = r.rows;
    $('sum').innerHTML = `<b>${r.total.toLocaleString('pt-BR')}</b> registro(s)` + (t.soma?` · soma: <b>${brl(r.soma)}</b>`:'') + (t.abrir?' · clique numa linha para abrir o dossiê':'');
    $('tb').innerHTML = r.rows.length ? r.rows.map((x,i)=>`<tr ${t.abrir?`class="click" data-i="${i}"`:''}>${t.cols.map(c=>cell(x,c)).join('')}</tr>`).join('')
      : `<tr><td class="empty" colspan="${t.cols.length}">Nada encontrado.</td></tr>`;
    const m=$('mais'); m.hidden = r.total<=st.lim; m.textContent=`Mostrar mais (${(r.total-st.lim).toLocaleString('pt-BR')} restantes)`;
  };
  if (id==='projetos') aoVivoALBA();
  let tm; $('q').addEventListener('input',e=>{ st.q=e.target.value; st.lim=200; clearTimeout(tm); tm=setTimeout(draw,350); });
  $('main').querySelectorAll('th.ord').forEach(th=>th.addEventListener('click',()=>{ const k=th.dataset.k; st.ord=[k, st.ord[0]===k&&st.ord[1]==='desc'?'asc':'desc'];
    $('main').querySelectorAll('th').forEach(x=>x.removeAttribute('data-dir')); th.dataset.dir=st.ord[1]; draw(); }));
  $('mais').addEventListener('click',()=>{ st.lim+=500; draw(); });
  $('tb').addEventListener('click',e=>{ if(e.target.closest('a,button')) return; const tr=e.target.closest('tr[data-i]'); if(!tr) return;
    const r=st.rows[+tr.dataset.i]; const [tipo,campo]=t.abrir; if(r[campo]) abrirDossie(tipo, r[campo]); });
  $('xls').addEventListener('click',()=>{ const u=new URL('/api/csv',location.origin); for(const [k,v] of Object.entries(params())) if(v) u.searchParams.set(k,v);
    if (window.F360_CELULAR && window.F360_abrirPC) return window.F360_abrirPC(u.pathname+u.search, 'Planilha');   // no celular a planilha vem do PC
    location.href=u; });
  $('pdf').addEventListener('click',async()=>{ const r = await api('/api/tabela',{...params(), lim:5000});
    const filt=[st.q&&`busca: "${st.q}"`,...Object.entries(st.f).filter(([,v])=>v).map(([k,v])=>`${k}: ${v}`)].filter(Boolean).join(' · ');
    const doc=novoPDF(t.nome+' · Governo da Bahia', `${r.total.toLocaleString('pt-BR')} registro(s)${t.soma?' · soma: '+brl(r.soma):''}${filt?' · '+filt:''}${r.total>5000?' · PDF com os 5.000 primeiros (use “Planilha” para tudo)':''} · gerado em ${hoje()}`);
    if(t.nota) pdfTexto(doc,t.nota,8.5);
    pdfTabela(doc,'',t.cols.filter(c=>!['ctr','lic','conv','em'].includes(c[2])),r.rows); await salvarPDF(doc,t.nome+(filt?' - '+filt:'')); });
  draw();
}

      <input type="search" id="qp" placeholder="Filtrar pautas…"></div>
    ${uni ? '<p class="note"><b>Pautas da União</b>: cota parlamentar dos deputados federais e senadores da Bahia, emendas Pix e casos graves dos alertas federais.</p>' : munInteresse() ? (L.length ? `<p class="note"><b>Mostrando só as pautas de ${esc(L[0].municipio||munInteresse())}</b> (emendas destinadas à cidade, convênios, fornecedores registrados no município, alertas ligados a eles e projetos da ALBA que citam a cidade). Apague o campo para ver a Bahia toda.</p>`
      : `<p class="empty">Não encontrei pautas para “${esc(munInteresse())}”. Confira o nome completo do município da Bahia (ex.: Feira de Santana, Vitória da Conquista) ou apague o campo para ver a Bahia toda.</p>`) : ''}
    <div id="lp" class="pautas"></div>`;
  const draw = () => { const t=$('ftema').value, q=$('qp').value.toLowerCase(), gv=$('fgrav').value, fs=$('fsp').value, fpp=$('fpp').value;
    const V = L.filter(p=>(!gv||p.gravidade===gv)&&(!t||p.tema===t)&&(!fs||String(+(p.ativa!==false))===fs)&&okPartido(fpp,p.partidos||[])&&(!q||(p.manchete+' '+p.linha_fina+' '+p.tema).toLowerCase().includes(q)));
    $('lp').innerHTML = V.map(p=>`<button class="pauta g-${p.gravidade||'info'}${p.ativa===false?' antigo':''}" data-abrir="pauta" data-ref="${esc(p.id)}">
      <span class="topo">${pilulaGrav(p)}${p._nova?'<span class="pill novo">NOVA</span>':''}${p.ativa===false?'<span class="pill ant" title="Não aparece na última atualização dos dados. Continua aqui para consulta.">ANTERIOR</span>':''}<span class="c">${esc(p.tema)}${(p.partidos||[]).length?' · <b>'+esc(p.partidos.join(', '))+'</b>':''}</span></span><span class="rel" title="Relevância estimada">${Math.round(p.relevancia)}</span>
      <b>${esc(p.manchete)}</b><span class="note">${esc(p.linha_fina||'')}</span>
      <span class="nums">${(p.numeros||[]).slice(0,3).map(([k,v])=>`<span><i>${esc(k)}</i>${esc(v)}</span>`).join('')}</span><span class="quando">${datasPauta(p)}</span></button>`).join('') || '<p class="empty">Nenhuma pauta com esse filtro.</p>'; };
  $('ftema').addEventListener('change',draw); $('fgrav').addEventListener('change',draw); $('fpp').addEventListener('change',draw); $('fsp').addEventListener('change',draw); $('qp').addEventListener('input',draw);
  $('munp').addEventListener('change',e=>{ try{ localStorage.setItem(MUN_KEY, e.target.value.trim()); }catch(_){} renderPautas(); });
  draw();
}

async function dossiePauta(id){
  const p = await api('/api/pauta', /^[ug]-/.test(String(id)) ? {id, esfera:'uniao'} : {id, municipio: munInteresse()}); p.id = p.id || id;
  if (p.erro) { $('main').innerHTML = `<p class="empty">${esc(p.erro)}</p>`; return; }
  const tab = t => t && t.rows && t.rows.length ? `<div class="grp"><h3>${esc(t.titulo)} · ${t.rows.length}</h3><div class="tbl"><table><thead><tr>${t.cols.map(c=>`<th>${esc(c[1])}</th>`).join('')}</tr></thead><tbody>${t.rows.slice(0,200).map(r=>`<tr>${t.cols.map(c=>cell(r,c)).join('')}</tr>`).join('')}</tbody></table></div></div>` : '';
  const ul = (t,L) => L && L.length ? `<div class="grp"><h3>${t}</h3><ul class="docs">${L.map(x=>`<li>${typeof x==='string'?esc(x):`<a href="${esc(x.u)}" target="_blank" rel="noopener">${esc(x.t)}</a>`}</li>`).join('')}</ul></div>` : '';
  $('main').innerHTML = `<div class="doshead"><button class="more" id="volta">← Voltar</button>${p.abrir?`<button class="more" data-abrir="${p.abrir.tipo}" data-ref="${esc(p.abrir.ref)}">${esc(p.abrir.rotulo)} →</button>`:''}</div>
    <span class="topo">${pilulaGrav(p)}<span class="c">${esc(p.tema)}</span></span><p class="note" style="margin:4px 0 0"><b>Gravidade do indício:</b> ${esc((GRAV[p.gravidade]||GRAV.info)[0])} · ${esc(p.motivo_gravidade||'')}</p><h2 style="font-size:1.35rem;margin:4px 0">${esc(p.manchete)}</h2><p class="note" style="font-size:.95rem">${esc(p.linha_fina||'')}</p><p class="quando">${datasPauta(p)}</p>${p.ativa===false?'<p class="note"><b>Pauta anterior:</b> não aparece na última atualização dos dados (os números abaixo são da última vez em que apareceu).</p>':''}
    <div id="ptrab"></div>${blocoConteudo()}
    <div class="grp"><h3>Lead</h3><p>${esc(p.lead)}</p></div>
    <div class="res">${(p.numeros||[]).map(([k,v])=>`<div>${esc(k)}</div><div>${esc(v)}</div>`).join('')}</div>
    ${p.checagem?`<div class="grp"><h3>Checagem: o que já foi verificado e o que falta</h3>${ul('Verificações que reforçam o indício', p.checagem.feitas)}${ul('Verificações que NÃO confirmaram (podem explicar o caso)', p.checagem.nao_confirmaram)}${ul('Ainda falta confirmar antes de publicar', p.checagem.falta)}${!(p.checagem.feitas||[]).length&&!(p.checagem.nao_confirmaram||[]).length?'<p class="note">Nenhuma verificação automática se aplica a este tipo de caso: tudo deve ser confirmado nos documentos.</p>':''}</div>`:''}
    ${ul('Por que importa', p.porque)}${ul('O que diz a lei', p.lei)}${ul('Perguntas para apurar e para os citados', p.perguntas)}${ul('Quem procurar', p.procurar)}${ul('Fontes oficiais', p.fontes)}
    ${tab(p.tabela)}${tab(p.tabela2)}<div id="pmdocs"></div>`;
  $('volta').addEventListener('click', voltar);
  ligarConteudo(p); trabPauta(p);
  const termos = [p.municipio, p.abrir ? (p.abrir.tipo==='alerta' ? (String(p.abrir.ref).split('|')[2]||'') : String(p.abrir.ref)) : ''].filter(Boolean);
  if (termos.length) api('/api/meusdocs/relacionados',{termos:termos.join('|')}).then(L=>{ const el=$('pmdocs'); if(el) el.innerHTML=blocoMeusDocs(L); }).catch(()=>{});
}

function blocoConteudo(titulo='Gerar conteúdo', nota='', rotDossie='Dossiê da pauta'){
  return `<div class="grp"><h3>${titulo}</h3>${nota?`<p class="note">${nota}</p>`:''}<div class="acoes">

         ['materia','Matéria para publicar','Título, linha fina, lead, corpo, outro lado e “como apuramos”'],['nota','Pedido de posicionamento','E-mail para as assessorias dos citados, com as perguntas'],

function ligarConteudo(p){

// ------------------------------------------------------------ geradores de conteúdo (roteiros, matéria, posicionamento, dossiê, post)
const linhaTab = (t, n=8) => (t&&t.rows||[]).slice(0,n).map(r=>t.cols.map(c=>fmtPDF(r[c[0]],c[2])).filter(Boolean).join(' – '));
function fontesTxt(p){ return (p.fontes||[]).map(f=>`${f.t}: ${f.u}`); }
function hashtags(p){ const base=['#Bahia','#DinheiroPúblico','#Transparência']; const t=(p.tema||'').toLowerCase();
  if(t.includes('emenda')) base.push('#EmendasParlamentares','#ALBA'); if(t.includes('publicidade')) base.push('#Publicidade','#Eleições2026');
  if(t.includes('dívida')||t.includes('empr')) base.push('#Dívida','#Empréstimos'); if(t.includes('contrat')||t.includes('licita')||t.includes('compra')) base.push('#Licitação','#Contratos');
  if(t.includes('assembleia')) base.push('#ALBA','#Legislativo'); if(p.id==='municipio') base.push('#'+munInteresse().replace(/\s+/g,''));
  return base.join(' '); }

// lei curta e legível (o cadastro oficial traz o artigo inteiro em maiúsculas)
function leiCurta(x){ let t=String(x||'').trim(); if (t.replace(/[^A-ZÀ-Ú]/g,'').length > t.replace(/[^a-zà-ú]/g,'').length) t=t.toLowerCase().replace(/(^|[.;]\s+)([a-zà-ú])/g,(m,a,b)=>a+b.toUpperCase()).replace(/\blei\b/g,'Lei').replace(/\bart\./g,'art.');
  return t.length>200 ? t.slice(0,t.lastIndexOf(' ',200))+'…' : t; }
const primeiraFrase = t => { const m=String(t||'').match(/^.{20,220}?[.!?](\s|$)/); return (m?m[0]:String(t||'').slice(0,200)).trim(); };
function conteudo(tipo, p){
  const N = (p.numeros||[]).filter(([k])=>!/índice de risco/i.test(k)), B = [];
  const T = (titulo)=>B.push({titulo}), H=(h)=>B.push({h}), P=(t)=>B.push({p:t}), LI=(l)=>B.push({li:l});
  const hoje_ = new Date().toLocaleDateString('pt-BR');
  if (tipo==='curto') {
    T('ROTEIRO – VÍDEO CURTO (60 a 90 s)'); B.push({assunto:p.manchete});
    H('[0–5 s] GANCHO');
    P(`FALA: “${primeiraFrase(p.lead)||p.manchete}”`);
    P(`NA TELA: ${N[0]?`${N[0][0]}: ${N[0][1]}`:p.manchete.slice(0,80)}`);
    H('[5–20 s] O FATO'); P(`FALA: “${p.manchete.split(';')[0]}. E isso está nos dados oficiais.”`); P(`NA TELA: ${p.linha_fina||''}`);
    H('[20–45 s] A PROVA (um número por corte)'); N.slice(0,4).forEach(([k,v])=>P(`FALA: “${k}: ${v}.”  ·  NA TELA: ${v}`)); P('IMAGEM: print do documento oficial com o endereço do site visível');
    H('[45–65 s] POR QUE É GRAVE'); P(`FALA: “${(p.porque||[])[0]||''}”`); if((p.lei||[])[0]) P(`NA TELA: ${leiCurta(p.lei[0])}`);
    H('[65–80 s] A COBRANÇA'); (p.perguntas||[]).slice(0,2).forEach(q=>P(`FALA: “${q}”`));
    H('[75–90 s] CHAMADA'); P('“Os documentos estão no link da bio. Compartilhe para mais gente saber para onde vai o dinheiro público. [Só diga se for verdade: Pedimos explicações aos responsáveis e aguardamos resposta.]”');
    H('IMAGENS DE APOIO (B-roll)'); LI([...(p.imagens||[]), 'Print da fonte oficial com o endereço visível', 'Trecho do documento oficial em destaque']);
    H('LEGENDA DO POST'); P(`${p.manchete}. ${(p.linha_fina||'')}. Fonte: dados oficiais (${(p.fontes||[]).map(f=>f.t.split(' –')[0]).join('; ')}). ${hashtags(p)}`);
    H('CUIDADOS'); LI([`Gravidade do indício: ${(GRAV[p.gravidade]||GRAV.info)[0]} (${p.motivo_gravidade||''}). Ajuste o tom do vídeo a isso.`, 'Fale em “dados oficiais mostram” e “indícios”, nunca afirme crime.', 'Cite que os envolvidos foram procurados (use o pedido de posicionamento antes de publicar).', 'Mostre a fonte na tela por pelo menos 2 segundos.']);
  }
  else if (tipo==='longo') {
